<html lang="pt-BR">
<head>

    gtag('config', 'G-GTSEBKVH96');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=54">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
</head>
<body data-page="atendimento" data-title="Atendimento">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <nav class="conteudo-tabs" id="abas-origem" aria-label="Filtrar por origem">
          <button type="button" class="conteudo-tab is-active" data-origem="cliente">
            Anfitriões<span class="aba-contagem" data-contagem="cliente"></span>
          </button>
          <button type="button" class="conteudo-tab" data-origem="fornecedor">
            B2B<span class="aba-contagem" data-contagem="fornecedor"></span>
          </button>
        </nav>

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar protocolo ou nome...">
          <select class="field-select" id="filtro-status">
            <option value="aberto" selected>Aberto</option>
            <option value="em_andamento">Em andamento</option>
            <option value="resolvido">Resolvido</option>
            <option value="fechado">Fechado</option>
            <option value="">Todos os status</option>
          </select>
        </div>

        <p class="contagem-chamados" id="contagem-chamados"></p>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Protocolo</th><th>Solicitante</th><th>Assunto</th><th>Status</th><th>Aberto em</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/atendimento.js"></script>
</body>
</html>
