<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=144">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=9"></script>
  <script src="js/shell.js?v=34"></script>
</head>
<body data-page="atendimento" data-title="Atendimento">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <!-- Abas por situação; a busca e a origem ficam no topo da lista. -->
        <nav class="conteudo-tabs" id="abas-status" aria-label="Conversas">
          <button type="button" class="conteudo-tab is-active" data-aba="pendentes">Pendentes<span class="aba-contagem" data-contagem="pendentes"></span></button>
          <button type="button" class="conteudo-tab" data-aba="chat">Chat<span class="aba-contagem" data-contagem="chat"></span></button>
          <button type="button" class="conteudo-tab" data-aba="email">E-mail<span class="aba-contagem" data-contagem="email"></span></button>
          <button type="button" class="conteudo-tab" data-aba="todos">Todos</button>
          <button type="button" class="conteudo-tab" data-aba="resolvidos">Resolvidos</button>
        </nav>

        <!-- Uma caixa só: a tabela de conversas ocupa a largura toda; clicar
             numa linha abre a conversa no lugar da tabela (seta volta). -->
        <section class="card table-card" id="caixa-conversas">
          <div class="table-toolbar">
            <div class="table-toolbar-esq"><input type="search" class="search-input" id="busca" placeholder="Buscar nome, e-mail, protocolo..."></div>
            <div class="table-toolbar-dir">
              <select class="field-select" id="filtro-origem" aria-label="Origem" style="width:auto">
                <option value="">Todas as origens</option>
                <option value="cliente">Anfitriões</option>
                <option value="fornecedor">Fornecedores</option>
                <option value="site">Site</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Nome</th><th>Mensagem</th><th>Origem</th><th>Canal</th><th>Status</th><th>Quando</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>

        <section class="card inbox-conversa" id="inbox-conversa" hidden></section>
      </main>
    </div>
  </div>

  <script src="js/editor-rico.js?v=7"></script>
  <script src="js/atendimento.js?v=11"></script>
</body>
</html>
