<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=134">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=8"></script>
  <script src="js/shell.js?v=21"></script>
</head>
<body data-page="atendimento" data-title="Atendimento">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <!-- Abas por situação; a busca e a origem ficam no topo da lista. -->
        <nav class="conteudo-tabs" id="abas-status" aria-label="Conversas">
          <button type="button" class="conteudo-tab is-active" data-aba="pendentes">Pendentes<span class="aba-contagem" data-contagem="pendentes"></span></button>
          <button type="button" class="conteudo-tab" data-aba="chat">Chat<span class="aba-contagem" data-contagem="chat"></span></button>
          <button type="button" class="conteudo-tab" data-aba="email">E-mail<span class="aba-contagem" data-contagem="email"></span></button>
          <button type="button" class="conteudo-tab" data-aba="todos">Todos</button>
          <button type="button" class="conteudo-tab" data-aba="resolvidos">Resolvidos</button>
        </nav>

        <div class="inbox">
          <section class="card inbox-lista">
            <div class="inbox-lista-topo">
              <input type="search" class="search-input" id="busca" placeholder="Buscar nome, e-mail, protocolo...">
              <select class="field-select" id="filtro-origem" aria-label="Origem">
                <option value="">Todas as origens</option>
                <option value="cliente">Anfitriões</option>
                <option value="fornecedor">Empresas</option>
                <option value="site">Site</option>
              </select>
            </div>
            <div class="inbox-itens" id="inbox-itens"></div>
          </section>

          <section class="card inbox-conversa" id="inbox-conversa">
            <div class="inbox-vazio">
              <strong>Escolha uma conversa</strong>
              <p>As mensagens de anfitriões, empresas e do site chegam aqui. Responda com uma resposta pronta ou escreva a sua — a pessoa recebe por e-mail e na plataforma.</p>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/editor-rico.js?v=7"></script>
  <script src="js/atendimento.js?v=7"></script>
</body>
</html>
