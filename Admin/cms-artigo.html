<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=53">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
</head>
<body data-page="cms" data-title="Artigo">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div class="editor-grid">
          <div class="editor-coluna">
            <input type="text" class="editor-titulo" id="artigo-titulo"
                   placeholder="Digite o título aqui" autocomplete="off">

            <section class="card editor-card" id="editor-host"></section>
          </div>

          <aside class="editor-lateral">
            <section class="card editor-bloco">
              <p class="editor-bloco-titulo">Publicar</p>

              <div class="lista-dados">
                <div class="dados-linha">
                  <span class="rotulo">Situação</span>
                  <span class="valor" id="artigo-situacao">Rascunho</span>
                </div>
                <div class="dados-linha">
                  <span class="rotulo">Publicado em</span>
                  <span class="valor" id="artigo-publicado-em">—</span>
                </div>
              </div>

              <div class="editor-acoes">
                <button type="button" class="btn btn-ghost" id="btn-rascunho">Salvar rascunho</button>
                <button type="button" class="btn btn-primary" id="btn-publicar">Publicar</button>
              </div>

              <button type="button" class="editor-lixeira" id="btn-lixeira" hidden>Mover para a lixeira</button>
            </section>

            <section class="card editor-bloco">
              <p class="editor-bloco-titulo">Imagem de capa</p>
              <div class="capa-previa" id="capa-previa"><span>Nenhuma imagem</span></div>
              <input type="file" id="capa-arquivo" accept="image/*" hidden>
              <div class="editor-acoes">
                <button type="button" class="btn btn-ghost btn-sm" id="btn-capa">Escolher imagem</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btn-remover-capa" hidden>Remover</button>
              </div>
            </section>

            <section class="card editor-bloco">
              <p class="editor-bloco-titulo">Categorias</p>
              <div class="categorias-lista" id="categorias-lista"></div>
              <div class="categoria-nova">
                <input type="text" class="field-input" id="categoria-nome" placeholder="Nova categoria">
                <button type="button" class="btn btn-ghost btn-sm" id="btn-categoria">Adicionar</button>
              </div>
            </section>

            <section class="card editor-bloco">
              <p class="editor-bloco-titulo">Resumo</p>
              <textarea class="field-textarea" id="artigo-resumo"
                        placeholder="Texto curto que aparece na listagem do blog."></textarea>
            </section>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="js/editor-rico.js"></script>
  <script src="js/cms-artigo.js"></script>
</body>
</html>
