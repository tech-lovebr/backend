  <meta charset="UTF-8">

  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">

<body data-page="cms-legal" data-title="Legal">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <!-- Abas e o Salvar na mesma linha, com o botão à direita. -->
        <div class="legal-abas">
          <nav class="conteudo-tabs" id="abas-documento" aria-label="Documento">
            <button type="button" class="conteudo-tab is-active" data-doc="termos">Termos de uso</button>
            <button type="button" class="conteudo-tab" data-doc="privacidade">Política de privacidade</button>
          </nav>
          <button type="button" class="btn btn-neutro" data-salvar-legal>Salvar alterações</button>
        </div>

        <p class="legal-ultima-edicao">
          Última edição: <strong id="doc-atualizado">—</strong>
        </p>

        <section class="card editor-card" id="editor-host"></section>

        <div class="legal-rodape">
          <button type="button" class="btn btn-neutro" data-salvar-legal>Salvar alterações</button>
        </div>

      </main>
    </div>
  </div>

  <script src="js/editor-rico.js"></script>
  <script src="js/cms-legal.js?v=3"></script>
</body>
</html>
