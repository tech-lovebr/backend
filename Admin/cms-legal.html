<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=50">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
</head>
<body data-page="cms-legal" data-title="Legal">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <nav class="conteudo-tabs" id="abas-documento" aria-label="Documento">
          <button type="button" class="conteudo-tab is-active" data-doc="termos">Termos de uso</button>
          <button type="button" class="conteudo-tab" data-doc="privacidade">Política de privacidade</button>
        </nav>

        <div class="editor-grid">
          <div class="editor-coluna">
            <section class="card editor-card" id="editor-host"></section>
          </div>

          <aside class="editor-lateral">
            <section class="card editor-bloco">
              <p class="editor-bloco-titulo">Publicação</p>

              <div class="lista-dados">
                <div class="dados-linha">
                  <span class="rotulo">Última edição</span>
                  <span class="valor" id="doc-atualizado">—</span>
                </div>
              </div>

              <label class="field" style="margin-top:.875rem">
                <span class="field-label">Em vigor desde</span>
                <input type="date" class="field-input" id="doc-vigencia">
              </label>

              <div class="editor-acoes">
                <button type="button" class="btn btn-primary" id="btn-salvar">Salvar</button>
              </div>

              <p class="cell-muted" style="font-size:.75rem;line-height:1.6;margin:.75rem 0 0">
                O texto salvo passa a valer nas duas plataformas e na página pública.
              </p>
            </section>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="js/editor-rico.js"></script>
  <script src="js/cms-legal.js"></script>
</body>
</html>
