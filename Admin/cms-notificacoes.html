<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=96">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/shell.js?v=8"></script>
</head>
<body data-page="cms-notificacoes" data-title="Notificações">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar assunto...">

          <div class="filtro-wrap">
            <button type="button" class="btn btn-ghost" id="btn-filtros" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v2.172a2 2 0 0 1 -.586 1.414l-4.414 4.414v7l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227z" /></svg>
              <span>Filtrar</span>
              <span class="filtro-badge" id="filtro-badge" hidden></span>
            </button>

            <div class="filtro-menu" id="filtro-menu" hidden>
              <label class="field" style="margin-bottom:0">
                <span class="field-label">Perfil</span>
                <select class="field-select" id="filtro-perfil">
                  <option value="">Todos</option>
                  <option value="b2b">HUB/B2B</option>
                  <option value="anfitriao">Anfitriões</option>
                </select>
              </label>
              <label class="field" style="margin:.75rem 0 0">
                <span class="field-label">Status</span>
                <select class="field-select" id="filtro-status">
                  <option value="">Todas</option>
                  <option value="enviada">Enviadas</option>
                  <option value="agendada">Agendadas</option>
                </select>
              </label>
              <button type="button" class="filtro-limpar" id="limpar-filtros">Limpar filtros</button>
            </div>
          </div>
        </div>


        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Assunto</th><th>Conteúdo</th><th>Envio</th>
                <th class="col-numero">Views</th><th class="col-fixar"></th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/cms-notificacoes.js?v=4"></script>
</body>
</html>
