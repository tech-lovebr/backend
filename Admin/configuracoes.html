<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=89">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/shell.js?v=4"></script>
</head>
<body data-page="configuracoes" data-title="Configurações">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="config-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem;max-width:900px">

          <div class="card">
            <div class="card-head"><div><h2>Seus dados</h2></div></div>
            <div class="card-body">
              <form id="form-perfil" autocomplete="off">
                <label class="field">
                  <span class="field-label">Nome</span>
                  <input class="field-input" name="name" type="text">
                </label>
                <label class="field">
                  <span class="field-label">E-mail</span>
                  <input class="field-input" name="email" type="email" disabled>
                </label>
                <label class="field">
                  <span class="field-label">Função</span>
                  <input class="field-input" name="funcao" type="text" disabled>
                </label>

                <button type="button" class="btn btn-primary" id="btn-salvar-perfil">Salvar dados</button>
              </form>
            </div>
          </div>

          <!-- Só o super admin vê: o JS revela depois de conferir o papel. -->
          <div class="card" id="card-seguranca" hidden>
            <div class="card-head"><div><h2>Segurança</h2></div></div>
            <div class="card-body">
              <form id="form-senha" autocomplete="off">
                <!-- Só a máscara: o painel nunca conhece a senha de verdade. -->
                <label class="field">
                  <span class="field-label">Senha atual</span>
                  <input class="field-input" type="password" value="••••••••••" disabled aria-label="Senha atual, salva">
                </label>
                <div class="field senha-nova">
                  <label class="field-label" for="senha-nova">Nova senha</label>
                  <input class="field-input" id="senha-nova" name="nova" type="password" autocomplete="new-password"
                         aria-describedby="senha-regras">
                  <ul class="senha-regras" id="senha-regras" hidden>
                    <li data-regra="tamanho">Mínimo de 8 caracteres</li>
                    <li data-regra="numero">Pelo menos 1 número</li>
                    <li data-regra="simbolo">Pelo menos 1 símbolo</li>
                  </ul>
                </div>
                <label class="field">
                  <span class="field-label">Confirmar nova senha</span>
                  <input class="field-input" name="confirmacao" type="password" autocomplete="new-password">
                </label>
                <button type="button" class="btn btn-primary" id="btn-salvar-senha">Salvar senha</button>
              </form>
            </div>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script src="js/configuracoes.js"></script>
</body>
</html>
