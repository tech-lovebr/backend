<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=138">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=8"></script>
  <script src="js/shell.js?v=25"></script>
</head>
<body data-page="dashboard" data-title="Dashboard">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <section class="bloco dash-graficos">
          <div class="card viz-root">
            <div class="dash-grafico-topo" id="grafico-topo"></div>
            <div class="viz-body dash-grafico" id="grafico-financeiro"></div>
          </div>

          <div class="card viz-root">
            <div class="viz-head">
              <select class="field-select" id="rosca-tipo" aria-label="O que a rosca mostra">
                <option value="eventos">Eventos por categoria</option>
                <option value="receita">Receita por origem</option>
                <option value="custos">Custos por empresa</option>
              </select>
            </div>
            <div class="viz-body" id="grafico-categorias"></div>
          </div>
        </section>

        <div class="bloco-cabecalho">
          <h2>Últimos cadastros</h2>
          <div class="toolbar">
            <input type="search" class="search-input" id="busca-contas" placeholder="Buscar e-mail ou nome...">
            <select class="field-select" id="filtro-origem" style="width:auto">
              <option value="">Todos os canais</option>
              <option value="b2b">Hub - B2B</option>
              <option value="anfitriao">Anfitriões</option>
              <option value="sem_origem">Sem origem</option>
            </select>
          </div>
        </div>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th class="col-numero">ID</th><th>E-mail</th><th>Canal</th><th>Criada em</th><th>Último acesso</th>
              </tr></thead>
              <tbody id="tbody-contas"></tbody>
            </table>
          </div>
          <nav class="paginacao" id="paginacao-contas" hidden></nav>
        </section>
      </main>
    </div>
  </div>

  <script src="js/conta-drawer.js?v=5"></script>
  <script src="js/dashboard.js?v=16"></script>
</body>
</html>
