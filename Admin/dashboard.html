<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visão geral — Love Admin</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=47">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
</head>
<body data-page="dashboard" data-title="Visão geral">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <section class="card bloco viz-root">
          <div class="viz-head">
            <div>
              <h2>Evolução financeira</h2>
              <p>Volume transacionado e faturamento dos fornecedores, por mês</p>
            </div>
            <div class="viz-legend" id="legenda-evolucao"></div>
          </div>
          <div class="viz-body" id="grafico-evolucao"></div>
          <details class="viz-tabela">
            <summary>Ver os números</summary>
            <div class="table-wrap" id="tabela-evolucao"></div>
          </details>
        </section>

        <section class="bloco" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.25rem">

          <div class="card viz-root">
            <div class="viz-head">
              <div>
                <h2>Top fornecedores</h2>
                <p>Por contratos ativos</p>
              </div>
            </div>
            <div class="viz-body" id="top-fornecedores"></div>
          </div>

          <div class="card viz-root">
            <div class="viz-head">
              <div>
                <h2>Eventos por categoria</h2>
                <p>Participação de cada categoria no total</p>
              </div>
            </div>
            <div class="viz-body" id="grafico-categorias"></div>
          </div>

        </section>
      </main>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
