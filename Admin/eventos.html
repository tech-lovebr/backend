<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=142">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=8"></script>
  <script src="js/shell.js?v=31"></script>
</head>
<body data-page="eventos" data-title="Eventos">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar título ou anfitrião...">
          <select class="field-select" id="filtro-tipo">
            <option value="">Todas as categorias</option>
            <option value="wedding">Casamento</option>
            <option value="baby">Chá de bebê</option>
            <option value="birthday">Aniversário</option>
            <option value="corporate">Corporativo</option>
            <option value="other">Outro</option>
          </select>
          <select class="field-select" id="filtro-situacao" aria-label="Situação">
            <option value="">Todos os eventos</option>
            <option value="ativos">Não excluídos</option>
            <option value="excluidos">Excluídos</option>
          </select>
        </div>

        <div class="barra-selecao" id="barra-selecao" hidden>
          <span class="barra-selecao-contagem" id="selecao-contagem"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-limpar-selecao">Limpar seleção</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-excluir-selecao">Excluir</button>
        </div>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data linhas-estaticas">
              <thead><tr>
                <th class="col-selecao"><input type="checkbox" id="selecionar-todos" aria-label="Selecionar todos"></th>
                <th>Evento</th><th>Categoria</th><th>Cliente</th><th>Data</th>
                <th>Convidados</th><th>Confirmados</th><th>Presentes</th><th>Arrecadado</th><th>Status</th><th class="col-acoes"></th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/eventos.js?v=3"></script>
</body>
</html>
