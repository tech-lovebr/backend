<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=128">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=8"></script>
  <script src="js/shell.js?v=21"></script>
</head>
<body data-page="financeiro" data-title="Financeiro">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <section class="card table-card bloco">
          <div class="table-toolbar">
            <div class="table-toolbar-esq"><input type="search" class="search-input" id="busca-extrato" placeholder="Pesquisar..."></div>
            <div class="table-toolbar-dir">
              <select class="field-select" id="filtro-origem-extrato" style="width:auto">
                <option value="">Todas as origens</option>
                <option value="presentes">Presentes</option>
                <option value="contratos">Contratos</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Data</th><th>Origem</th><th>Gateway</th><th>Processado</th><th>Repasse</th><th>Love</th><th>Status</th></tr></thead>
              <tbody id="tbody-extrato"></tbody>
            </table>
          </div>
        </section>

        <section class="card bloco">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Fornecedor</th><th>Plano</th><th>Entradas</th><th>Saídas</th><th>Saldo</th><th>Contratos</th><th>Valor em contratos</th></tr></thead>
              <tbody id="tbody-fornecedores"></tbody>
            </table>
          </div>
        </section>

        <section class="card bloco">
          <div class="card-head" style="justify-content:flex-end">
            <select class="field-select" id="filtro-status-link" style="width:auto">
              <option value="">Todos</option>
              <option value="pago">Pagos</option>
              <option value="pendente">Pendentes</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Fornecedor</th><th>Valor</th><th>Parcelas</th><th>Status</th><th>Criado em</th><th>Pago em</th></tr></thead>
              <tbody id="tbody-links"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/financeiro.js?v=2"></script>
</body>
</html>
