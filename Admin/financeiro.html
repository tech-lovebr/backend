  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=145">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=9"></script>

<body data-page="financeiro" data-title="Financeiro">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <section class="bloco">
          <div class="card viz-root">
            <div class="dash-grafico-topo" id="grafico-topo"></div>
            <div class="viz-body dash-grafico" id="grafico-financeiro"></div>
          </div>
        </section>

        <section class="card table-card bloco">
          <div class="table-toolbar">
            <div class="table-toolbar-esq"><input type="search" class="search-input" id="busca-extrato" placeholder="Pesquisar..."></div>
            <div class="table-toolbar-dir">
              <select class="field-select" id="filtro-origem-extrato" style="width:auto">
                <option value="">Todas as origens</option>
                <option value="evento">Evento</option>
                <option value="fornecedor">Fornecedor</option>
                <option value="assinatura">Assinatura</option>
              </select>
              <select class="field-select" id="filtro-tipo-extrato" style="width:auto">
                <option value="">Entradas e saídas</option>
                <option value="entrada">Só entradas</option>
                <option value="saida">Só saídas</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Data</th><th>Origem</th><th>Tipo</th><th>Valor processado</th><th>Take rate</th><th>Status</th></tr></thead>
              <tbody id="tbody-extrato"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/financas.js?v=2"></script>
  <script src="js/financeiro.js?v=3"></script>
</body>
</html>
