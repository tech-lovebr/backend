  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="financeiro" data-title="Financeiro">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">

        <section class="kpi-grid" id="kpi-grid"></section>

        <section class="card bloco">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Fornecedor</th><th>Plano</th><th>Entradas</th><th>Saídas</th><th>Saldo</th><th>Contratos</th><th>Valor em contratos</th></tr></thead>
              <tbody id="tbody-fornecedores"></tbody>
            </table>
          </div>
        </section>

        <section class="card bloco">
          <div class="card-head" style="justify-content:flex-end">
            <select class="field-select" id="filtro-status-link" style="width:auto">
              <option value="">Todos</option>
              <option value="pago">Pagos</option>
              <option value="pendente">Pendentes</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Fornecedor</th><th>Valor</th><th>Parcelas</th><th>Status</th><th>Criado em</th><th>Pago em</th></tr></thead>
              <tbody id="tbody-links"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/financeiro.js"></script>
</body>
