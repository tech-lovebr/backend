<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo — Love</title>
  <meta name="description" content="Acesso restrito à administração da plataforma Love.">
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=36">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
</head>
<body class="login-page">

  <div class="login-fundo" aria-hidden="true"></div>

  <main class="login-conteudo">
    <img src="assets/logo_blue.png" alt="Love" class="login-logo">

    <p class="login-intro">
      Para entrar no painel administrativo, informe seu e-mail e sua senha
      corretamente.
    </p>

    <hr class="login-divisor">

    <form id="login-form" novalidate>
      <label class="login-campo">
        <span>E-mail</span>
        <input id="login-email" type="email" autocomplete="username" required>
      </label>

      <label class="login-campo">
        <span>Senha</span>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>

      <button type="submit" class="login-botao" id="login-submit">Entrar</button>

      <p id="login-error" class="login-erro" style="display:none"></p>
    </form>

    <a href="#" class="login-link" id="login-esqueci">Esqueceu sua senha?</a>

    <p id="nota-demo" class="login-nota" style="display:none">
      <strong>Modo demonstração.</strong> Os dados são fictícios e ficam só neste
      navegador. Entre com qualquer e-mail e senha.
    </p>

    <p id="nota-producao" class="login-nota">
      Área restrita. Novos administradores são cadastrados pela equipe Love.
    </p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    // Mensagem de quem logou com uma conta que não é de administrador.
    if (new URLSearchParams(location.search).get('erro') === 'sem-acesso') {
      showError('Esta conta não tem permissão de administrador. Fale com a equipe Love para liberar o acesso.');
    }

    if (MODO_DEMO_ATIVO) {
      document.getElementById('nota-demo').style.display = 'block';
      document.getElementById('nota-producao').style.display = 'none';
      document.getElementById('login-email').value = 'admin@love.com.br';
      document.getElementById('login-password').value = 'demo';
    }

    // Já logado e com permissão? Vai direto para o dashboard.
    if (!MODO_DEMO_ATIVO) supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) return;
      const { data } = await supabaseClient.from('admins')
        .select('id, active').eq('id', session.user.id).maybeSingle();
      if (data && data.active) window.location.replace('dashboard.html');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Preencha e-mail e senha para continuar.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando…';

      const { data: signIn, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        showError('E-mail ou senha incorretos.');
        return;
      }

      // Autenticou — mas só entra quem está na tabela `admins` e está ativo.
      const { data: admin } = await supabaseClient.from('admins')
        .select('id, active').eq('id', signIn.user.id).maybeSingle();

      if (!admin || !admin.active) {
        await supabaseClient.auth.signOut();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
        showError('Esta conta não tem permissão de administrador.');
        return;
      }

      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
