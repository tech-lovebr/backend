<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=50">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
</head>
<body data-page="produtos" data-title="Serviços/Produtos">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">
        <section class="kpi-grid" id="kpi-grid"></section>

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar produto, serviço ou empresa...">
          <select class="field-select" id="filtro-categoria"><option value="">Todas as categorias</option></select>
          <select class="field-select" id="filtro-cobranca"><option value="">Toda cobrança</option></select>
        </div>

        <!-- Tudo o que os fornecedores cadastraram no Catálogo de serviços do Hub. -->
        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Produto/Serviço</th><th>Empresa</th><th>Local</th><th>Cobrança</th><th>Valor</th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/produtos.js"></script>
</body>
</html>
