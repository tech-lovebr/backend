  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços — Love Admin</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=47">

  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js"></script>

<body data-page="servicos" data-title="Serviços">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">
        <section class="kpi-grid" id="kpi-grid"></section>

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar serviço ou parceiro...">
          <select class="field-select" id="filtro-categoria"><option value="">Todas as categorias</option></select>
        </div>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Serviço</th><th>Categoria</th><th>Parceiro</th><th>Preço</th><th>Cobrança</th><th>Status</th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/servicos.js"></script>
</body>
</html>
