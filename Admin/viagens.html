<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo Love</title>
  <meta name="theme-color" content="#183b54">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="assets/fav-admin.png">
  <link rel="apple-touch-icon" href="assets/fav-admin.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=77">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/shell.js"></script>

<body data-page="viagens" data-title="Love Viagens" data-title-link="https://loveviagens.com.br">

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content">
        <section class="kpi-grid" id="kpi-grid"></section>

        <div id="page-controls" hidden>
          <input type="search" class="search-input" id="busca" placeholder="Buscar pacote ou destino...">
          <select class="field-select" id="filtro-tipo">
            <option value="">Todos os tipos</option>
            <option value="lua_de_mel">Lua de mel</option>
            <option value="destination_wedding">Destination wedding</option>
            <option value="experiencia">Experiência</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <section class="card table-card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr>
                <th>Pacote</th><th>Destino</th><th>Tipo</th><th>Período</th><th>Preço</th><th>Vagas</th><th>Status</th>
              </tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/viagens.js"></script>
</body>
</html>
