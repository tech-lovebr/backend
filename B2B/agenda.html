<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão — Portal do Fornecedor Love</title>
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } } }</script>
  <link rel="stylesheet" href="css/styles.css?v=721">
</head>
<body class="font-sans" data-page="agenda">
  <div class="b2b-shell">
    <div id="shell-sidebar"></div>
    <div class="b2b-main">
      <div id="shell-topbar"></div>
      <main class="b2b-content">
        <div class="b2b-header-bar">
          <h2 class="text-xl font-bold text-zinc-900">Gestão de Trabalho</h2>
          <button type="button" id="share-board-btn" class="btn-secondary builder-toolbar-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.25 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM3.25 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.364.63 13.067 13.067 0 0 1-6.76 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM19.75 7.5a.75.75 0 0 0-1.5 0v2.25H16a.75.75 0 0 0 0 1.5h2.25v2.25a.75.75 0 0 0 1.5 0v-2.25H22a.75.75 0 0 0 0-1.5h-2.25V7.5Z" /></svg>
            <span id="share-board-btn-label">Compartilhar agenda</span>
          </button>
        </div>

        <div class="category-tabs-bar" id="work-view-tabs">
          <button type="button" class="category-tab active" data-view="agenda">Agenda</button>
          <button type="button" class="category-tab" data-view="quadro">Tarefas</button>
        </div>

        <div data-view-panel="quadro" style="display:none;">
          <div class="kanban-board" id="kanban-board"></div>
        </div>

        <div data-view-panel="agenda">
          <div class="agenda-calendar-layout">
            <div class="agenda-left-col">
              <div class="agenda-mini-calendar dash-card">
                <div class="mini-cal-header">
                  <button type="button" class="mini-cal-nav-btn" id="mini-cal-prev" aria-label="Mês anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m15 19-7-7 7-7" /></svg>
                  </button>
                  <span class="mini-cal-month-label" id="mini-cal-month-label">—</span>
                  <button type="button" class="mini-cal-nav-btn" id="mini-cal-next" aria-label="Próximo mês">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7" /></svg>
                  </button>
                </div>
                <div class="mini-cal-weekdays">
                  <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                </div>
                <div class="mini-cal-grid" id="mini-cal-grid"></div>
                <button type="button" class="btn-secondary mini-cal-today-btn" id="mini-cal-today-btn">Hoje</button>
              </div>

              <div class="agenda-notifications-card dash-card">
                <div class="dash-card-header">
                  <div class="dash-card-header-left">
                    <h2 class="text-base font-bold text-zinc-900">Avisos</h2>
                  </div>
                </div>
                <div class="agenda-notif-list" id="agenda-notifications-list"></div>
              </div>
            </div>

            <div class="agenda-timeline-panel dash-card">
              <div class="agenda-timeline-header">
                <div class="agenda-dia-nav">
                  <button type="button" class="btn-secondary builder-toolbar-btn" id="agenda-hoje-btn">Hoje</button>
                  <button type="button" class="agenda-dia-seta" id="agenda-dia-anterior" aria-label="Dia anterior" title="Dia anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg></button>
                  <button type="button" class="agenda-dia-seta" id="agenda-dia-proximo" aria-label="Próximo dia" title="Próximo dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg></button>
                  <h3 id="agenda-timeline-date-label">—</h3>
                </div>
              </div>
              <div class="agenda-timeline-scroll">
                <div class="agenda-timeline-grid" id="agenda-timeline-grid"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="task-drawer-backdrop"></div>
  <aside class="form-drawer task-drawer" id="task-drawer" aria-label="Detalhes da tarefa">
    <div class="form-drawer-header">
      <div class="form-drawer-header-main">
        <p class="task-drawer-list-label" id="task-drawer-list-label"></p>
        <h2 class="task-drawer-title" id="task-drawer-title" title="Clique para editar"></h2>
        <input type="text" class="task-drawer-title-input" id="task-drawer-title-input" hidden>
      </div>
      <button type="button" class="form-drawer-close" id="task-drawer-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="form-drawer-body task-drawer-body">
      <div class="task-drawer-dates-row">
        <div class="task-drawer-field">
          <label class="task-drawer-field-label">Criada em</label>
          <p class="task-drawer-created-value" id="task-drawer-created-value"></p>
        </div>
        <div class="task-drawer-field">
          <label class="task-drawer-field-label" for="task-drawer-due-input">Prazo</label>
          <div class="task-drawer-due-row">
            <input type="date" class="task-drawer-due-input" id="task-drawer-due-input">
            <button type="button" class="task-drawer-due-clear" id="task-drawer-due-clear" hidden>Remover prazo</button>
          </div>
        </div>
      </div>

      <div class="task-drawer-activity-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9M7.5 12h6M4.5 4.5h15A1.5 1.5 0 0 1 21 6v10.5a1.5 1.5 0 0 1-1.5 1.5H9l-4 3v-3H4.5A1.5 1.5 0 0 1 3 16.5V6a1.5 1.5 0 0 1 1.5-1.5Z" /></svg>
        <span>Comentários e atividade</span>
      </div>

      <div class="task-drawer-comment-card">
        <div class="task-drawer-comment-box">
          <textarea class="task-drawer-comment-input" id="task-drawer-comment-input" placeholder="Escrever um comentário..." rows="1"></textarea>
          <div class="task-drawer-comment-actions">
            <button type="button" class="btn-primary btn-comentar" id="task-drawer-comment-submit">Comentar</button>
          </div>
        </div>
      </div>

      <div class="task-drawer-activity-list" id="task-drawer-activity-list"></div>
    </div>
  </aside>

  <!-- Modal compartilhar agenda -->
  <div class="modal-backdrop" id="share-board-modal">
    <div class="modal-card" style="max-width:520px;">
      <div class="flex items-center justify-between mb-5">
        <h3 class="text-base font-bold text-zinc-900">Compartilhar agenda</h3>
        <button type="button" id="share-board-close" class="text-zinc-400 hover:text-zinc-700" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <div class="flex gap-2 mb-4">
        <input type="email" id="share-board-email" class="field-input" placeholder="Endereço de e-mail" style="flex:1;">
        <select id="share-board-invite-role" class="field-select share-board-role-select">
          <option value="view">Somente ver</option>
          <option value="edit" selected>Editar</option>
        </select>
        <button type="button" id="share-board-invite-btn" class="btn-secondary share-board-icon-btn" aria-label="Compartilhar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.25 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM3.25 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.364.63 13.067 13.067 0 0 1-6.76 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM19.75 7.5a.75.75 0 0 0-1.5 0v2.25H16a.75.75 0 0 0 0 1.5h2.25v2.25a.75.75 0 0 0 1.5 0v-2.25H22a.75.75 0 0 0 0-1.5h-2.25V7.5Z" /></svg>
        </button>
      </div>

      <div class="share-board-link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="share-board-link-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5 21 3m0 0h-5.25M21 3v5.25M10.5 13.5 3 21m0 0h5.25M3 21v-5.25" /></svg>
        <div class="flex-1 min-w-0">
          <p class="text-sm text-zinc-700 font-medium">Compartilhar esta agenda com um link</p>
          <button type="button" id="share-board-create-link" class="share-board-link-btn">Criar link</button>
          <div id="share-board-link-generated" class="share-board-link-generated" hidden>
            <input type="text" id="share-board-link-input" class="field-input" readonly>
            <button type="button" id="share-board-copy-link" class="btn-secondary">Copiar link</button>
          </div>
        </div>
      </div>

      <div class="category-tabs-bar share-board-tabs" id="share-board-tabs">
        <button type="button" class="category-tab active" data-share-tab="membros">Membros da agenda <span id="share-board-members-count"></span></button>
        <button type="button" class="category-tab" data-share-tab="solicitacoes">Solicitações para entrar</button>
      </div>

      <div data-share-panel="membros" id="share-board-members-list"></div>

      <div data-share-panel="solicitacoes" style="display:none;">
        <p class="text-sm text-zinc-500 py-4 text-center">Nenhuma solicitação pendente.</p>
      </div>
    </div>
  </div>

  <!-- Drawer evento da agenda -->
  <!-- Evento da agenda: pop-up (clicar num horário da linha do tempo abre
       aqui, já com o horário). Mesmos ids do drawer antigo. -->
  <div class="agenda-evento-fundo" id="event-drawer-backdrop"></div>
  <div class="agenda-evento-popup" id="event-drawer" role="dialog" aria-modal="true" aria-label="Evento da agenda">
    <div class="agenda-evento-topo">
      <span class="agenda-evento-alca" aria-hidden="true"></span>
      <button type="button" class="agenda-evento-fechar" id="event-drawer-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <form id="event-form" class="agenda-evento-form">
      <input type="text" id="event-title" class="agenda-evento-titulo" placeholder="Adicionar título" autocomplete="off">

      <!-- Tipo continua salvo (padrão: Reunião), mas sai da tela. -->
      <div hidden>
        <select id="event-type">
          <option value="reuniao">Reunião</option>
          <option value="entrega">Entrega</option>
          <option value="visita">Visita técnica</option>
          <option value="outro">Outro</option>
        </select>
        <div id="event-type-custom-wrap" hidden><input id="event-type-custom" type="text"></div>
        <div id="event-desc-toolbar"></div>
      </div>

      <div class="agenda-evento-linha">
        <span class="agenda-evento-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
        <div class="agenda-evento-quando">
          <p id="event-drawer-date-label">—</p>
          <div class="agenda-evento-horas">
            <span class="agenda-hora-wrap" id="event-horas-campos">
              <input id="event-start" type="text" class="agenda-hora-btn" readonly aria-label="Início" aria-haspopup="listbox">
              <span class="agenda-hora-ate">até</span>
              <input id="event-end" type="text" class="agenda-hora-btn" readonly aria-label="Fim" aria-haspopup="listbox">
            </span>
            <label class="agenda-dia-inteiro"><input type="checkbox" id="event-dia-inteiro"> Dia inteiro</label>
          </div>
        </div>
      </div>

      <div class="agenda-evento-linha">
        <span class="agenda-evento-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></span>
        <input id="event-link" type="url" class="agenda-evento-campo" placeholder="Adicionar link" autocomplete="off">
      </div>

      <div class="agenda-evento-linha">
        <span class="agenda-evento-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
        <input id="event-local" type="text" class="agenda-evento-campo" placeholder="Adicionar local" autocomplete="off">
      </div>

      <div class="agenda-evento-linha">
        <span class="agenda-evento-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></span>
        <div id="event-description" class="agenda-evento-campo agenda-evento-descricao" contenteditable="true" data-placeholder="Adicionar descrição"></div>
      </div>

      <div class="agenda-evento-linha">
        <span class="agenda-evento-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M18.5 19.5a6.5 6.5 0 0 0-3-5.5"/></svg></span>
        <div class="agenda-evento-convidados">
          <input id="event-guest-input" type="email" class="agenda-evento-campo" placeholder="Convidar pessoas" autocomplete="off">
          <div class="event-guest-chips" id="event-guest-chips"></div>
        </div>
      </div>

      <div class="agenda-evento-rodape">
        <button type="button" id="event-drawer-cancel" class="btn-secondary">Cancelar</button>
        <button type="button" id="event-delete-btn" class="agenda-event-delete-btn" hidden>Excluir</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Modal: avisar convidados -->
  <div class="modal-backdrop" id="event-guest-notify-modal">
    <div class="modal-card" style="max-width:420px; text-align:center;">
      <h3 class="text-base font-bold text-zinc-900 mb-2">Avisar convidados</h3>
      <p class="text-sm text-zinc-500 mb-6">Deseja enviar avisando os seus convidados sobre este compromisso?</p>
      <div class="flex gap-3">
        <button type="button" class="btn-secondary flex-1 justify-center" id="event-guest-notify-cancel">Cancelar</button>
        <button type="button" class="btn-primary flex-1 justify-center" id="event-guest-notify-send">Enviar</button>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=18"></script>
  <script src="js/utils.js?v=32"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=2"></script>
  <script src="js/shell.js?v=56"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="js/agenda.js?v=38"></script>
</body>
</html>
