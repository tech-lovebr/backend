<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens — Portal do Fornecedor Love</title>
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=715">
</head>
<body class="font-sans" data-page="chat">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="b2b-header-bar">
          <h2 class="text-xl font-bold text-zinc-900">Mensagens</h2>
        </div>
        <div class="chat-shell w-full flex-1 min-h-0 bg-white flex flex-col md:flex-row overflow-hidden border-t border-zinc-200">
          
          <!-- COLUNA ESQUERDA: LISTA DE CONVERSAS / CONTATOS (W-80 / 340px) -->
          <div class="b2b-chat-contacts-column w-full md:w-80 lg:w-[340px] md:min-w-[320px] border-r border-zinc-200 flex flex-col h-full flex-shrink-0">
            
            <!-- Header da Lista -->
            <!-- Mesma altura fixa (64px) do cabeçalho da conversa à direita,
                 pra linha de baixo das duas colunas ficar alinhada. -->
            <div class="b2b-chat-contacts-header px-4 h-[64px] flex items-center border-b border-zinc-200 flex-shrink-0">
              <!-- Busca de Contatos -->
              <div class="relative w-full">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" id="chat-search-input" placeholder="Buscar nas conversas..." class="w-full pl-9 pr-3.5 py-2 rounded-xl border border-zinc-200/90 bg-white text-xs focus:outline-none focus:ring-1 focus:ring-[#537bae] text-zinc-800 transition-colors shadow-2xs placeholder:text-zinc-400">
              </div>
            </div>

            <!-- Lista de Contatos dos Fornecedores -->
            <div id="conv-list" class="flex-1 overflow-y-auto divide-y divide-zinc-200/60">
              <!-- Contatos injetados dinamicamente via JS -->
            </div>

          </div>

          <!-- COLUNA DIREITA: JANELA DO CHAT ATIVO -->
          <div class="flex-1 flex flex-col bg-white min-w-0 h-full">
            
            <!-- Chat Header -->
            <div class="px-6 py-3.5 bg-white border-b border-zinc-200 flex items-center justify-between flex-shrink-0 h-[64px]">
              <div class="flex items-center gap-3.5 min-w-0">
                <div class="relative flex-shrink-0">
                  <span id="chat-header-avatar" class="w-10 h-10 b2b-avatar-square border border-zinc-200"></span>
                  <span id="chat-header-online-dot" class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
                </div>
                <div class="min-w-0">
                  <h4 id="chat-header-name" class="text-sm font-semibold text-zinc-900 truncate">Mariana & Co. Assessoria</h4>
                  <p id="chat-header-status" class="text-xs text-zinc-400 truncate"><span class="text-emerald-600 font-medium">Online agora</span></p>
                </div>
              </div>
            </div>

            <!-- Chat Stream (Scroll de Mensagens) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-white">
              <!-- Injetado dinamicamente via JS -->
            </div>

            <!-- Chat Input Bar -->
            <div class="p-4 bg-white border-t border-zinc-200 flex-shrink-0">
              <form id="chat-form" class="relative flex items-center gap-3" onsubmit="return false;">
                <!-- Comandos de modelo: aparece ao digitar "/" (js/chat-modelos.js) -->
                <div id="chat-command-menu" class="chat-command-menu" hidden></div>
                <input type="file" id="chat-file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
                <div class="chat-attach-wrap" id="chat-attach-wrap">
                  <button type="button" id="chat-attach-btn" class="chat-composer-icon-btn" title="Adicionar anexo ou foto">
                    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                  </button>
                  <div class="kanban-list-dropdown chat-attach-dropdown" id="chat-attach-dropdown">
                    <div id="chat-attach-menu-view">
                      <button type="button" class="kanban-list-dropdown-item" id="chat-attach-file-option">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m6 12L9.75 18l-2.25-2.25M12.75 15v6M8.25 21h7.5A2.25 2.25 0 0 0 18 18.75V7.5l-4.5-4.5H8.25A2.25 2.25 0 0 0 6 5.25v13.5A2.25 2.25 0 0 0 8.25 21Z"/></svg>
                        Arquivo
                      </button>
                      <button type="button" class="kanban-list-dropdown-item" id="chat-attach-form-option">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 3.75h6M9 8.25h2.25M9 21h6a2.25 2.25 0 0 0 2.25-2.25V6.622a2.25 2.25 0 0 0-.659-1.591l-2.622-2.622A2.25 2.25 0 0 0 12.378 1.75H9A2.25 2.25 0 0 0 6.75 4v14.75A2.25 2.25 0 0 0 9 21Z"/></svg>
                        Formulário
                      </button>
                    </div>
                    <div id="chat-attach-form-view" hidden>
                      <button type="button" class="kanban-color-picker-back" id="chat-attach-form-back">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
                        Voltar
                      </button>
                      <div id="chat-attach-form-list"></div>
                    </div>
                  </div>
                </div>
                <!-- Meus comandos (raio = automação): abre o drawer dos comandos "/" -->
                <button type="button" id="chat-commands-btn" class="chat-composer-icon-btn" title="Comandos rápidos" aria-label="Comandos rápidos">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 3 4 14h7l-1 7 9-11h-7l1-7Z"/>
                  </svg>
                </button>
                <input type="text" id="chat-input" placeholder="Digite / para ver comandos rápidos" class="flex-1 text-xs sm:text-sm bg-white border border-zinc-200 rounded-xl px-4 py-2.5 sm:py-3 focus:outline-none focus:ring-2 focus:ring-[#537bae] text-zinc-800 placeholder:text-zinc-400 shadow-2xs" autocomplete="off">
                <button type="submit" id="chat-send-btn" class="bg-[#27394f] hover:bg-[#1d2b3c] text-white px-5 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer shadow-xs flex-shrink-0" style="background-color: #27394f !important;" title="Enviar mensagem">
                  <span>Enviar</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
              </form>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js?v=18"></script>
  <script src="js/utils.js?v=32"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=2"></script>
  <script src="js/shell.js?v=55"></script>
  <!-- Menu ⋮ das mensagens do fornecedor -->
  <div id="chat-msg-menu" class="chat-msg-menu" role="menu">
    <button type="button" id="chat-msg-menu-edit" role="menuitem">Editar</button>
    <button type="button" id="chat-msg-menu-copy" role="menuitem">Copiar</button>
    <button type="button" id="chat-msg-menu-template" role="menuitem">Salvar comando</button>
  </div>

  <!-- Drawer: Meus comandos (lista) / Adicionar comando (formulário) -->
  <div class="drawer-backdrop" id="template-drawer-backdrop"></div>
  <aside class="form-drawer" id="template-drawer" aria-label="Comandos rápidos">
    <div class="form-drawer-header">
      <div class="form-drawer-header-main">
        <h2 class="task-drawer-title" id="template-drawer-title">Comandos rápidos</h2>
      </div>
      <button type="button" class="form-drawer-close" id="template-drawer-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="form-drawer-body">

      <!-- Lista -->
      <div id="template-list-view">
        <div id="template-list" class="flex flex-col gap-2"></div>
        <!-- Primeira vez (nenhum comando): o botão fica aqui, e o formulário
             aparece abaixo ao clicar. -->
        <div id="template-list-empty" class="comandos-vazio" hidden>
          <span class="comandos-vazio-icone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H12L11 22l8.5-11.5H12L13 2Z"/></svg></span>
          <p class="comandos-vazio-texto">Você ainda não tem comandos.</p>
          <button type="button" id="template-empty-add-btn" class="btn-primary">Adicionar comando</button>
        </div>
      </div>

      <!-- Formulário -->
      <div id="template-form-view" class="flex flex-col gap-4" hidden>
        <div>
          <label for="template-text" class="field-label">Mensagem</label>
          <textarea id="template-text" class="field-textarea" style="min-height:140px;" maxlength="4000"></textarea>
        </div>
        <div>
          <label for="template-command" class="field-label">Nome do comando</label>
          <div class="chat-template-command-field">
            <span>/</span>
            <input id="template-command" type="text" class="field-input" maxlength="40" autocomplete="off" spellcheck="false">
          </div>
          <p id="template-error" class="text-xs text-rose-600 mt-1" hidden></p>
        </div>
      </div>
    </div>
    <div class="form-drawer-footer" id="template-drawer-footer">
      <button type="button" id="template-drawer-cancel" class="btn-secondary">Cancelar</button>
      <button type="button" id="template-add-btn" class="btn-primary">Adicionar comando</button>
      <button type="button" id="template-save-btn" class="btn-primary" hidden>Salvar comando</button>
    </div>
  </aside>

  <script src="js/mensagens.js?v=30"></script>
  <script src="js/chat-modelos.js?v=10"></script>
</body>
</html>
