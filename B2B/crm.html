<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM · Oportunidades — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } } }</script>
  <link rel="stylesheet" href="css/styles.css?v=435">
</head>
<body class="font-sans" data-page="crm">
  <div class="b2b-shell">
    <div id="shell-sidebar"></div>
    <div class="b2b-main">
      <div id="shell-topbar"></div>
      <main class="b2b-content">
        <div class="b2b-header-bar">
          <h2 class="text-xl font-bold text-zinc-900">Contatos</h2>
          <div class="flex items-center gap-3">
            <div class="relative" style="width:240px;">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              <input type="text" id="lead-search-input" class="field-input" style="padding-left:2.25rem;" placeholder="Pesquisar contato...">
            </div>
            <button type="button" id="lead-add-btn" class="btn-secondary builder-toolbar-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
              Adicionar contato
            </button>
          </div>
        </div>
        <p class="text-sm text-zinc-500 mb-5">Acompanhe seus leads e oportunidades de negócio.</p>

        <div class="category-tabs-bar" id="lead-status-tabs"></div>

        <div class="dash-card">
          <div class="overflow-x-auto -mx-1">
            <table class="leads-table w-full">
              <thead>
                <tr><th>Nome</th><th>Produto/Serviço</th><th>Data do evento</th><th>Valor</th><th>Status</th></tr>
              </thead>
              <tbody id="leads-table-body"></tbody>
            </table>
          </div>
        </div>
        <p class="crm-footer-count" id="leads-count-label"></p>
      </main>
    </div>
  </div>

  <!-- Drawer contato -->
  <div class="drawer-backdrop" id="lead-drawer-backdrop"></div>
  <aside class="form-drawer" id="lead-drawer" aria-label="Contato">
    <div class="form-drawer-header">
      <div class="form-drawer-header-main">
        <p class="task-drawer-list-label">Contatos</p>
        <h2 class="task-drawer-title" id="lead-drawer-title">Novo contato</h2>
      </div>
      <button type="button" class="form-drawer-close" id="lead-drawer-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="form-drawer-body">
      <p class="text-sm text-zinc-500 -mt-2 mb-4" id="lead-drawer-subtitle">Adicione um novo lead para a sua base de contatos</p>
      <form id="lead-form" class="flex flex-col gap-4">
        <div>
          <label for="lead-name" class="field-label">Nome</label>
          <input id="lead-name" type="text" class="field-input" placeholder="Ex: Marcela Oliveira">
        </div>

        <div>
          <label for="lead-email" class="field-label">E-mail</label>
          <input id="lead-email" type="email" class="field-input" list="lead-email-options" placeholder="cliente@email.com" autocomplete="off">
          <datalist id="lead-email-options"></datalist>
          <p class="text-xs text-zinc-400 mt-1" id="lead-email-match-hint" hidden>✓ Vinculado à conta deste cliente na Love</p>
        </div>

        <div>
          <label for="lead-product" class="field-label">Produto/Serviço de interesse</label>
          <select id="lead-product" class="field-select"></select>
          <a href="produtos.html" target="_blank" rel="noopener" class="lead-add-product-link" id="lead-add-product-link">+ Cadastrar serviço</a>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="lead-date" class="field-label">Data do evento</label>
            <input id="lead-date" type="text" class="field-input" placeholder="Ex: 18 Out 2026">
          </div>
          <div>
            <label for="lead-value" class="field-label">Valor estimado (R$)</label>
            <input id="lead-value" type="number" min="0" step="100" class="field-input" placeholder="0,00">
          </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="lead-drawer-cancel" class="btn-secondary">Cancelar</button>
          <button type="button" id="lead-delete-btn" class="agenda-event-delete-btn" hidden>Excluir</button>
        </div>
      </form>

      <div id="lead-comments-section" hidden>
        <div class="task-drawer-activity-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9M7.5 12h6M4.5 4.5h15A1.5 1.5 0 0 1 21 6v10.5a1.5 1.5 0 0 1-1.5 1.5H9l-4 3v-3H4.5A1.5 1.5 0 0 1 3 16.5V6a1.5 1.5 0 0 1 1.5-1.5Z" /></svg>
          <span>Observações e comentários</span>
        </div>
        <div class="task-drawer-comment-card">
          <div class="task-drawer-comment-box">
            <textarea class="task-drawer-comment-input" id="lead-comment-input" placeholder="Escrever um comentário..." rows="1"></textarea>
            <div class="task-drawer-comment-actions">
              <button type="button" class="btn-primary" id="lead-comment-submit">Comentar</button>
            </div>
          </div>
        </div>
        <div class="task-drawer-activity-list" id="lead-activity-list"></div>
      </div>
    </div>
  </aside>

  <script src="js/data.js?v=12"></script>
  <script src="js/utils.js?v=10"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=1"></script>
  <script src="js/shell.js?v=24"></script>
  <script src="js/crm.js?v=6"></script>
</body>
</html>
