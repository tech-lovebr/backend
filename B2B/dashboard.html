<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans" data-page="dashboard">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">

        <div class="dashboard-greeting">
          <p class="greeting-date" id="greeting-date">—</p>
          <h1 class="greeting-title" id="greeting-title">—</h1>
        </div>

        <div class="stats-grid">
          <div class="metric-card stats-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="stats-bar-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" /></svg>
            <div>
              <span class="stats-bar-value" id="stat-leads">—</span>
              <span class="stats-bar-label">Leads</span>
            </div>
          </div>

          <div class="metric-card stats-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="stats-bar-icon"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 3.75h6M13.5 3H7.125A1.125 1.125 0 0 0 6 4.125v15.75c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V8.25L13.5 3Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 3v4.5A1.5 1.5 0 0 0 15 9h4.5" /></svg>
            <div>
              <span class="stats-bar-value" id="stat-pendentes">—</span>
              <span class="stats-bar-label">Contratos pendentes</span>
            </div>
          </div>

          <div class="metric-card stats-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="stats-bar-icon"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
            <div>
              <span class="stats-bar-value" id="stat-ativos">—</span>
              <span class="stats-bar-label">Contratos ativos</span>
            </div>
          </div>
        </div>

        <div class="dash-card mb-6">
          <div class="dash-card-header">
            <div class="dash-card-header-left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-zinc-400"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" /></svg>
              <h2 class="text-base font-bold text-zinc-900">Meus contratos</h2>
              <select class="period-select" id="contracts-period">
                <option>Esta semana</option>
                <option selected>Este mês</option>
                <option>Últimos 3 meses</option>
              </select>
            </div>
            <a href="contratos.html" class="text-sm font-semibold text-[color:var(--primary-blue)] hover:underline">Ver todos</a>
          </div>
          <div class="overflow-x-auto -mx-1">
            <table class="leads-table w-full">
              <thead>
                <tr><th>Cliente</th><th>Evento</th><th>Valor</th><th>Data</th><th>Status</th></tr>
              </thead>
              <tbody id="contracts-table-body"></tbody>
            </table>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[1.3fr_1fr] gap-6">

          <div class="dash-card">
            <div class="dash-card-header">
              <div class="dash-card-header-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-zinc-400"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25m10.5-2.25v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" /></svg>
                <h2 class="text-base font-bold text-zinc-900">Agenda</h2>
              </div>
            </div>

            <div class="day-strip" id="day-strip"></div>
            <div id="agenda-list" class="mt-4"></div>
          </div>

          <div class="dash-card">
            <div class="dash-card-header">
              <div class="dash-card-header-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-zinc-400"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                <h2 class="text-base font-bold text-zinc-900">Tarefas</h2>
              </div>
              <button type="button" id="tarefa-add-btn" class="topbar-icon-btn tarefa-add-btn" style="width:30px;height:30px;" aria-label="Adicionar tarefa">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
              </button>
            </div>
            <div id="tarefas-list" class="flex flex-col"></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
