<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183b54">
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=686">
</head>
<body class="font-sans">

  <div class="signup-shell">
    <div class="signup-card">
      <a href="login" class="signup-logo">
        <img src="assets/logo.png" alt="Love">
      </a>

      <h1 class="signup-title">Esqueci minha senha</h1>
      <p class="signup-subtitle">Informe seu e-mail e enviaremos um link para você criar uma nova senha.</p>

      <form id="forgot-form" class="signup-email-form">
        <input type="email" id="forgot-email" class="field-input" placeholder="voce@empresa.com.br" required autocomplete="username">
        <button type="submit" class="btn-primary justify-center w-full py-3" id="forgot-btn">Enviar link</button>
        <p id="forgot-error" class="text-xs text-red-600 hidden"></p>
      </form>

      <p id="forgot-success" class="text-sm text-zinc-600 hidden">Se esse e-mail estiver cadastrado, você vai receber um link de recuperação em instantes. Pode fechar esta página.</p>

      <p class="signup-footer-link">Lembrou a senha? <a href="login">Entrar</a></p>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const errorEl = document.getElementById('forgot-error');
      const form = document.getElementById('forgot-form');
      const btn = document.getElementById('forgot-btn');

      errorEl.classList.add('hidden');
      btn.disabled = true;

      try {
        await fetch('/api/esqueci-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
      } catch (err) {
        // Mesmo se a chamada falhar, não expõe detalhes — mostra a mesma
        // mensagem genérica de sucesso (evita confirmar/negar se o e-mail existe).
      }

      form.classList.add('hidden');
      document.getElementById('forgot-success').classList.remove('hidden');
    });
  </script>
</body>
</html>
