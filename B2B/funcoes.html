<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funções — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=392">
</head>
<body class="font-sans" data-page="funcoes">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-xl font-bold text-zinc-900 mb-1">Funções</h2>
            <p class="text-sm text-zinc-500">Adicione pessoas da sua equipe para acessar a gestão da sua conta e defina o que cada uma pode ver ou editar.</p>
          </div>
          <button type="button" id="member-add-btn" class="btn-secondary builder-toolbar-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.25 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM3.25 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.364.63 13.067 13.067 0 0 1-6.76 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM19.75 7.5a.75.75 0 0 0-1.5 0v2.25H16a.75.75 0 0 0 0 1.5h2.25v2.25a.75.75 0 0 0 1.5 0v-2.25H22a.75.75 0 0 0 0-1.5h-2.25V7.5Z" /></svg>
            <span>Novo colaborador</span>
          </button>
        </div>

        <div class="dash-card">
          <div class="overflow-x-auto -mx-1">
            <table class="leads-table w-full">
              <thead>
                <tr><th>Colaborador</th><th>Função</th><th>Acesso</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="team-table-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Drawer novo/editar colaborador -->
  <div class="drawer-backdrop" id="member-drawer-backdrop"></div>
  <aside class="form-drawer" id="member-drawer" aria-label="Colaborador">
    <div class="form-drawer-header">
      <div class="form-drawer-header-main">
        <p class="task-drawer-list-label">Equipe</p>
        <h2 class="task-drawer-title" id="member-drawer-title">Novo colaborador</h2>
      </div>
      <button type="button" class="form-drawer-close" id="member-drawer-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="form-drawer-body">
      <form id="member-form" class="flex flex-col gap-4">
        <div>
          <label for="member-name" class="field-label">Nome</label>
          <input id="member-name" type="text" class="field-input" placeholder="Ex: Marcos Vinícius">
        </div>
        <div>
          <label for="member-email" class="field-label">E-mail</label>
          <input id="member-email" type="email" class="field-input" placeholder="pessoa@empresa.com.br">
        </div>

        <div>
          <label for="member-role" class="field-label">Função</label>
          <select id="member-role" class="field-select">
            <option value="Administrador">Administrador</option>
            <option value="Operacional" selected>Operacional</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Visualizador">Visualizador</option>
            <option value="Personalizado">Personalizado</option>
          </select>
          <p id="member-role-desc" class="role-template-desc"></p>
        </div>

        <div>
          <label class="field-label mb-1">Permissões (áreas que essa pessoa pode acessar)</label>
          <div class="permission-grid" id="member-permissions"></div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="member-drawer-cancel" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </aside>

  <script src="js/data.js?v=10"></script>
  <script src="js/utils.js?v=9"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=1"></script>
  <script src="js/shell.js?v=22"></script>
  <script src="js/funcoes.js?v=2"></script>
</body>
</html>
