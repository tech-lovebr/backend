<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Funções — Portal do Fornecedor Love</title>
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=841">
</head>
<body class="font-sans" data-page="funcoes">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="b2b-header-bar">
          <h2 class="text-xl font-bold text-zinc-900">Funções</h2>
          <button type="button" id="member-add-btn" class="btn-secondary builder-toolbar-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" /></svg>
            <span>Adicionar</span>
          </button>
        </div>
        <p class="text-sm text-zinc-500 mb-5">Adicione pessoas da sua equipe para acessar a gestão da sua conta e defina o que cada uma pode ver ou editar.</p>

        <div class="dash-card" id="team-table-card">
          <div class="overflow-x-auto leads-table-wrap">
            <table class="leads-table w-full">
              <thead>
                <tr><th>Colaborador</th><th>E-mail</th><th>Função</th><th>Acesso</th><th>Status</th><th class="tabela-col-acoes"></th></tr>
              </thead>
              <tbody id="team-table-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Drawer novo/editar colaborador -->
  <div class="drawer-backdrop" id="member-drawer-backdrop"></div>
  <aside class="form-drawer" id="member-drawer" aria-label="Colaborador">
    <div class="form-drawer-header">
      <div class="form-drawer-header-main">
        <h2 class="task-drawer-title" id="member-drawer-title">Novo colaborador</h2>
      </div>
      <button type="button" class="form-drawer-close" id="member-drawer-close" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="form-drawer-body">
      <form id="member-form" class="flex flex-col gap-4">
        <div>
          <label for="member-name" class="field-label">Nome</label>
          <input id="member-name" type="text" class="field-input">
        </div>
        <div>
          <label for="member-email" class="field-label">E-mail</label>
          <input id="member-email" type="email" class="field-input" placeholder="pessoa@empresa.com.br">
        </div>

        <div>
          <label for="member-role" class="field-label">Função</label>
          <select id="member-role" class="field-select">
            <option value="Administrador">Administrador</option>
            <option value="Operacional" selected>Operacional</option>
            <option value="Financeiro">Financeiro</option>
            <option value="Visualizador">Visualizador</option>
            <option value="Personalizado">Personalizado</option>
          </select>
          <p id="member-role-desc" class="role-template-desc"></p>
        </div>

        <div>
          <label class="field-label mb-1">Permissões (áreas que essa pessoa pode acessar)</label>
          <div class="permission-grid" id="member-permissions"></div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="member-drawer-cancel" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </aside>

  <script src="js/data.js?v=19"></script>
  <script src="js/utils.js?v=47"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=4"></script>
  <script src="js/shell.js?v=71"></script>
  <script src="js/funcoes.js?v=11"></script>
</body>
</html>
