<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Parceiro — Love</title>
  <meta name="description" content="Acesso de assessores e fornecedores parceiros da Love para gestão de leads, contratos e vitrine de serviços.">
  <meta name="theme-color" content="#537bae">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=463">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js"></script>
</head>
<body class="font-sans">

  <div class="signup-shell">
    <div class="signup-card">
      <a href="../index.html" class="signup-logo">
        <img src="assets/logo.png" alt="Love">
      </a>

      <h1 class="signup-title">Acesse sua conta</h1>
      <p class="signup-subtitle">Entre para gerenciar seus eventos e clientes.</p>

      <div class="signup-oauth">
        <button type="button" id="google-login-btn" class="signup-oauth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.07-1.47-.23-2.12H12v3.85h6.62c-.13 1.1-.86 2.76-2.47 3.88l-.02.15 3.59 2.78.25.02c2.28-2.1 3.55-5.19 3.55-8.56Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.94-2.9l-3.78-2.93c-1.01.7-2.37 1.19-4.16 1.19-3.18 0-5.88-2.1-6.84-5H1.27v3.02C3.25 21.3 7.31 24 12 24Z"/><path fill="#FBBC05" d="M5.16 14.36A7.4 7.4 0 0 1 4.75 12c0-.82.14-1.62.4-2.36V6.62H1.27A11.97 11.97 0 0 0 0 12c0 1.93.46 3.76 1.27 5.38l3.89-3.02Z"/><path fill="#EA4335" d="M12 4.75c2.25 0 3.77.97 4.64 1.78l3.39-3.31C17.94 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.62l3.89 3.02c.96-2.9 3.66-5 6.84-5Z"/></svg>
          Continuar com Google
        </button>

        <button type="button" id="apple-login-btn" class="signup-oauth-btn">
          <svg width="16" height="16" viewBox="0 0 170 170" fill="#18181B"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.07-7.66-7.83-11.87-14.28-5.77-8.91-10.35-18.9-13.74-29.96-3.4-11.06-5.1-21.73-5.1-32.01 0-14.65 3.63-26.68 10.89-36.09 7.26-9.41 16.5-14.23 27.72-14.47 4.58 0 9.87 1.25 15.86 3.76 6 2.5 9.8 3.82 11.41 3.94 1.34-.12 5.37-1.48 12.08-4.08 6.71-2.6 12.19-3.8 16.45-3.6 12.67.63 22.56 5.33 29.68 14.09-11.14 6.78-16.58 16.2-16.32 28.27.24 9.4 3.82 17.15 10.74 23.27 6.92 6.12 15.22 9.53 24.9 10.23-2.12 6.64-4.87 13.43-8.24 20.37zM119.22 31.84c0-7.39 2.66-14.35 7.98-20.89C132.52 4.41 139.19.78 147.21 0c.12 1.03.18 1.94.18 2.74 0 7.39-2.78 14.46-8.33 21.21-5.56 6.75-12.38 10.51-20.47 11.28-.48-1.14-.72-2.27-.72-3.39z"/></svg>
          Continuar com a Apple
        </button>
      </div>

      <div class="signup-divider">ou entre com e-mail</div>

      <form id="login-form" class="signup-email-form" style="text-align:left;">
        <div>
          <label for="login-email" class="field-label">E-mail</label>
          <input id="login-email" type="email" class="field-input" placeholder="voce@empresa.com.br" required autocomplete="username">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="field-label mb-0">Senha</label>
            <a href="esqueci-senha.html" class="text-xs font-medium text-[color:var(--primary-blue)] hover:underline">Esqueceu a senha?</a>
          </div>
          <input id="login-password" type="password" class="field-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary justify-center w-full py-3 mt-2">Continuar</button>

        <p id="login-error" class="text-xs text-red-600 hidden"></p>
        <p id="login-info" class="text-xs text-zinc-500 hidden"></p>
      </form>

      <p class="signup-legal">Ao continuar, você concorda com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> da Love.</p>

      <p class="signup-footer-link">Não tem uma conta? <a href="signup.html">Solicite seu cadastro</a></p>
    </div>
  </div>

  <script>
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'dashboard.html') }
      });
    });

    document.getElementById('apple-login-btn').addEventListener('click', () => {
      const infoEl = document.getElementById('login-info');
      infoEl.textContent = 'Login com Apple ainda não disponível. Use e-mail e senha ou Google.';
      infoEl.classList.remove('hidden');
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      errorEl.classList.add('hidden');

      if (!email || !password) {
        errorEl.textContent = 'Preencha e-mail e senha para continuar.';
        errorEl.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      submitBtn.disabled = false;

      if (error) {
        errorEl.textContent = 'E-mail ou senha incorretos.';
        errorEl.classList.remove('hidden');
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
