<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans" data-page="mensagens">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="chat-shell w-full h-full bg-white flex flex-col md:flex-row overflow-hidden border-t border-zinc-200">
          
          <!-- COLUNA ESQUERDA: LISTA DE CONVERSAS / CONTATOS (W-80 / 340px) -->
          <div class="w-full md:w-80 lg:w-[340px] md:min-w-[320px] border-r border-zinc-200 flex flex-col h-full flex-shrink-0" style="background-color: #FAFAFA !important;">
            
            <!-- Header da Lista -->
            <div class="p-4 border-b border-zinc-200/70 space-y-3 flex-shrink-0" style="background-color: #FAFAFA !important;">
              <div class="flex items-center justify-between">
                <h3 class="font-semibold text-zinc-900 text-base tracking-tight cursor-default" title="Chat com fornecedores">Mensagens</h3>
              </div>

              <!-- Busca de Contatos -->
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-400">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <input type="text" id="chat-search-input" placeholder="Buscar nas conversas..." class="w-full pl-9 pr-3.5 py-2 rounded-xl border border-zinc-200/90 bg-white text-xs focus:outline-none focus:ring-1 focus:ring-[#537bae] text-zinc-800 transition-colors shadow-2xs placeholder:text-zinc-400">
              </div>
            </div>

            <!-- Lista de Contatos dos Fornecedores -->
            <div id="conv-list" class="flex-1 overflow-y-auto divide-y divide-zinc-200/60" style="background-color: #FAFAFA !important;">
              <!-- Contatos injetados dinamicamente via JS -->
            </div>

          </div>

          <!-- COLUNA DIREITA: JANELA DO CHAT ATIVO -->
          <div class="flex-1 flex flex-col bg-white min-w-0 h-full">
            
            <!-- Chat Header -->
            <div class="px-6 py-3.5 bg-white border-b border-zinc-200 flex items-center justify-between flex-shrink-0 h-[64px]">
              <div class="flex items-center gap-3.5 min-w-0">
                <div class="relative flex-shrink-0">
                  <img id="chat-header-avatar" src="../assets/theme_garden.jpg" alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-zinc-200">
                  <span id="chat-header-online-dot" class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
                </div>
                <div class="min-w-0">
                  <h4 id="chat-header-name" class="text-sm font-semibold text-zinc-900 truncate">Mariana & Co. Assessoria</h4>
                  <p id="chat-header-status" class="text-xs text-zinc-400 truncate">Assessoria & Cerimonial • <span class="text-emerald-600 font-medium">Online agora</span></p>
                </div>
              </div>
            </div>

            <!-- Chat Stream (Scroll de Mensagens) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-white">
              <!-- Injetado dinamicamente via JS -->
            </div>

            <!-- Chat Input Bar -->
            <div class="p-4 bg-white border-t border-zinc-200 flex-shrink-0">
              <form id="chat-form" class="flex items-center gap-3" onsubmit="return false;">
                <input type="file" id="chat-file-input" class="hidden" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
                <button type="button" id="chat-attach-btn" class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-zinc-600 hover:text-[#537bae] hover:border-[#537bae]/40 flex items-center justify-center transition-all cursor-pointer flex-shrink-0 shadow-2xs group" title="Adicionar anexo ou foto">
                  <svg class="w-5 h-5 sm:w-6 sm:h-6 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                  </svg>
                </button>
                <input type="text" id="chat-input" placeholder="Escreva uma mensagem para o fornecedor..." class="flex-1 text-xs sm:text-sm bg-white border border-zinc-200 rounded-xl px-4 py-2.5 sm:py-3 focus:outline-none focus:ring-2 focus:ring-[#537bae] text-zinc-800 placeholder:text-zinc-400 shadow-2xs" autocomplete="off">
                <button type="submit" id="chat-send-btn" class="bg-[#5c7aaa] hover:bg-[#4e6891] text-white px-5 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all active:scale-95 cursor-pointer shadow-xs flex-shrink-0" style="background-color: #5c7aaa !important;" title="Enviar mensagem">
                  <span>Enviar</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
              </form>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/mensagens.js"></script>
</body>
</html>
