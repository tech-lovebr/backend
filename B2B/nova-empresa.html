<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->

  <script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar empresa — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183b54">
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Albert+Sans:wght@500;600;700;800&family=EB+Garamond:wght@700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=627">
</head>
<body class="font-sans" data-page="nova-empresa">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>
    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="b2b-header-bar">
          <h2 class="text-xl font-bold text-zinc-900">Adicionar empresa</h2>
        </div>

        <!-- Plano sem vaga para mais uma empresa (Gratuito: 1; Pro: até 3). -->
        <div class="dash-card nova-empresa-card" id="nova-empresa-limite" hidden>
          <p class="nova-empresa-limite-texto" id="nova-empresa-limite-texto"></p>
          <a href="planos" class="btn-primary nova-empresa-limite-btn" id="nova-empresa-limite-btn">Ver planos</a>
        </div>

        <!-- Nova empresa no mesmo login: nome, CNPJ, responsável e imagens. -->
        <form class="dash-card nova-empresa-card" id="nova-empresa-form" novalidate hidden>
          <div class="nova-empresa-imagens">
            <div>
              <p class="field-label">Imagem de perfil</p>
              <label class="nova-empresa-upload nova-empresa-upload--perfil" id="nova-empresa-perfil-zona">
                <input type="file" accept="image/*" id="nova-empresa-perfil" hidden>
                <span class="nova-empresa-upload-mais" aria-hidden="true">+</span>
                <img alt="" hidden>
              </label>
              <p class="profile-logo-hint">400 × 400 px</p>
            </div>
            <div class="nova-empresa-capa-col">
              <p class="field-label">Imagem de capa</p>
              <label class="nova-empresa-upload nova-empresa-upload--capa" id="nova-empresa-capa-zona">
                <input type="file" accept="image/*" id="nova-empresa-capa" hidden>
                <span class="nova-empresa-upload-mais" aria-hidden="true">+</span>
                <img alt="" hidden>
              </label>
              <p class="profile-logo-hint">1280 × 520 px</p>
            </div>
          </div>

          <div class="nova-empresa-campos">
            <div>
              <label for="nova-empresa-nome" class="field-label">Nome da empresa <span style="color:#DC2626;">*</span></label>
              <input id="nova-empresa-nome" type="text" class="field-input" autocomplete="organization">
            </div>
            <div>
              <label for="nova-empresa-cnpj" class="field-label">CNPJ <span style="color:#DC2626;">*</span></label>
              <input id="nova-empresa-cnpj" type="text" inputmode="numeric" class="field-input" placeholder="00.000.000/0000-00" autocomplete="off">
            </div>
            <div>
              <label for="nova-empresa-responsavel" class="field-label">Responsável principal <span style="color:#DC2626;">*</span></label>
              <input id="nova-empresa-responsavel" type="text" class="field-input" autocomplete="name">
            </div>
          </div>

          <p class="nova-empresa-erro" id="nova-empresa-erro" hidden></p>

          <div class="nova-empresa-rodape">
            <a href="dashboard" class="btn-secondary">Cancelar</a>
            <button type="submit" class="btn-primary" id="nova-empresa-salvar">Criar empresa</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/data.js?v=18"></script>
  <script src="js/utils.js?v=32"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=2"></script>
  <script src="js/shell.js?v=40"></script>
  <script src="js/nova-empresa.js?v=1"></script>
</body>
</html>
