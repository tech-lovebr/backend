<header class="b2b-topbar">
  <div class="topbar-account-wrap">
    <a href="dashboard" class="topbar-account-name" id="topbar-account-name" title="Ir para o início">—</a>
  </div>

  <button type="button" id="search-trigger" class="topbar-search-trigger">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
    <span>Buscar cliente, evento ou contrato…</span>
    <kbd>⌘K</kbd>
  </button>

  <div class="flex items-center gap-4 flex-shrink-0 ml-auto" id="topbar-icon-group">
    <a href="planos" id="header-upgrade-btn" class="topbar-upgrade-btn">
      <span>Upgrade</span>
    </a>

    <a href="chat" class="topbar-icon-plain topbar-messages-mobile-hide" data-page="chat" aria-label="Mensagens" data-dica="Mensagens">
      <!-- Mesmo ícone de Mensagens do love.com.br (balão com os 3 pontinhos). -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"/></svg>
      <span class="topbar-icon-badge" id="nav-msg-badge-header" style="display:none;">0</span>
    </a>

    <a href="produtos" class="topbar-icon-plain topbar-services-mobile-link" data-page="produtos" aria-label="Produtos" title="Produtos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5 12 2.25 3 7.5m18 0-9 5.25M21 7.5v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
    </a>

    <div class="topbar-icon-btn-wrap">
      <!-- Abre a página de Notificações. O número de não lidas começa
           escondido e vazio: só aparece quando o número real chega
           (updateNotificationsBadge em js/shell.js). -->
      <a href="notificacoes" id="notif-trigger" class="topbar-icon-plain" data-page="notificacoes" aria-label="Notificações" data-dica="Notificações">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
        <span class="topbar-icon-badge hidden" id="notif-dot"></span>
      </a>
    </div>

    <div class="topbar-icon-btn-wrap">
      <button type="button" id="avatar-trigger" class="topbar-avatar-btn">
        <span id="topbar-user-avatar" class="b2b-avatar" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#18181B;font-weight:600;font-size:.8125rem;"></span>
      </button>
      <div class="topbar-dropdown profile-dropdown" id="avatar-dropdown" style="right:0;left:auto;">
        <div class="profile-dropdown-header">
          <a href="configuracoes" id="profile-dropdown-avatar" class="profile-dropdown-avatar" title="Editar meu perfil"></a>
          <div class="min-w-0">
            <a href="configuracoes" class="profile-dropdown-name" id="profile-dropdown-name" title="Editar meu perfil">—</a>
            <p class="profile-dropdown-email" id="profile-dropdown-email">—</p>
          </div>
        </div>

        <div class="topbar-dropdown-divider"></div>

        <div id="profile-empresas" hidden></div>

        <a href="nova-empresa" class="topbar-dropdown-item topbar-item-adicionar-empresa">
          Adicionar empresa
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        </a>

        <div class="topbar-dropdown-divider"></div>

        <a href="configuracoes" class="topbar-dropdown-item">Configurações</a>
        <a href="funcoes" class="topbar-dropdown-item">Adicionar colaborador</a>
        <a href="planos" class="topbar-dropdown-item">Planos e recursos</a>
        <a href="central-de-ajuda" class="topbar-dropdown-item">Central de ajuda</a>

        <div class="topbar-dropdown-divider"></div>

        <!-- Sair: mesmo item e mesmo ícone do menu do love.com.br. -->
        <a href="login" data-logout class="topbar-dropdown-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="color:#A1A1AA;flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" /></svg>
          Sair
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Command palette -->
<div class="modal-backdrop" id="command-palette" style="align-items:flex-start;padding-top:12vh;">
  <div class="modal-card" style="max-width:560px;padding:0;overflow:visible;">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-200">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400 flex-shrink-0"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
      <input id="command-input" type="text" class="flex-1 border-none outline-none text-sm" placeholder="Buscar cliente, evento ou contrato…" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div id="command-results" class="max-h-80 overflow-y-auto p-2"></div>
  </div>
</div>
