<header class="b2b-topbar">
  <button type="button" id="search-trigger" class="topbar-search-trigger">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
    <span>Buscar cliente, evento ou contrato…</span>
    <kbd>⌘K</kbd>
  </button>

  <a href="planos.html" id="header-upgrade-btn" class="topbar-upgrade-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l0 14" /><path d="M16 9l-4 -4" /><path d="M8 9l4 -4" /></svg>
    <span>Upgrade</span>
  </a>

  <div class="flex items-center gap-2 flex-shrink-0 ml-auto">
    <a href="mensagens.html" class="topbar-icon-plain" data-page="mensagens" aria-label="Mensagens" title="Mensagens">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" /></svg>
      <span class="topbar-icon-badge" id="nav-msg-badge-header" style="display:none;">0</span>
    </a>

    <div class="topbar-icon-btn-wrap">
      <button type="button" id="notif-trigger" class="topbar-icon-plain" aria-label="Notificações">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
        <span class="topbar-icon-badge" id="notif-dot" style="display:none;">0</span>
      </button>
      <div class="topbar-dropdown" id="notif-dropdown" style="right:0;left:auto;">
        <p class="topbar-dropdown-title">Notificações</p>
        <div id="notif-list"></div>
      </div>
    </div>

    <div class="topbar-icon-btn-wrap">
      <button type="button" id="avatar-trigger" class="topbar-avatar-btn">
        <span id="topbar-user-avatar" class="b2b-avatar" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:.8125rem;"></span>
      </button>
      <div class="topbar-dropdown profile-dropdown" id="avatar-dropdown" style="right:0;left:auto;">
        <div class="profile-dropdown-header">
          <span id="profile-dropdown-avatar" class="profile-dropdown-avatar"></span>
          <div class="min-w-0">
            <p class="profile-dropdown-name" id="profile-dropdown-name">—</p>
            <p class="profile-dropdown-email" id="profile-dropdown-email">—</p>
            <a href="configuracoes.html" class="profile-dropdown-link">Perfil e Preferências</a>
          </div>
        </div>

        <div class="topbar-dropdown-divider"></div>

        <div class="profile-dropdown-account">
          <p class="profile-dropdown-account-label">Conta</p>
          <p class="profile-dropdown-account-name" id="profile-dropdown-company">—</p>
          <p class="profile-dropdown-account-doc" id="profile-dropdown-doc">—</p>
        </div>

        <div class="topbar-dropdown-divider"></div>

        <a href="guias.html" class="topbar-dropdown-item">Guia de início</a>
        <a href="funcoes.html" class="topbar-dropdown-item">Adicionar colaborador</a>
        <a href="planos.html" class="topbar-dropdown-item">Planos e recursos</a>
        <a href="configuracoes.html" class="topbar-dropdown-item">Configurações</a>

        <div class="topbar-dropdown-divider"></div>

        <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Tema">
          <button type="button" class="theme-toggle-btn" data-theme-option="light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg>
            Light
          </button>
          <button type="button" class="theme-toggle-btn" data-theme-option="dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" /></svg>
            Dark
          </button>
        </div>

        <div class="topbar-dropdown-divider"></div>

        <div class="profile-dropdown-footer">
          <a href="login.html" style="color:#B91C1C;">Sair</a>
          <a href="#">Política de privacidade</a>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Command palette -->
<div class="modal-backdrop" id="command-palette" style="align-items:flex-start;padding-top:12vh;">
  <div class="modal-card" style="max-width:560px;padding:0;overflow:visible;">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-200">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400 flex-shrink-0"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
      <input id="command-input" type="text" class="flex-1 border-none outline-none text-sm" placeholder="Buscar cliente, evento ou contrato…" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div id="command-results" class="max-h-80 overflow-y-auto p-2"></div>
  </div>
</div>
