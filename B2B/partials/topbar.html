<header class="b2b-topbar">
  <!-- Celular (só no Dashboard): logo à esquerda; sino e ☰ à direita. -->
  <a href="dashboard" class="logo-celular" aria-label="Love - início">
    <img class="logo-celular-icone logo-claro" src="assets/iconelove2.png?v=5" alt="" aria-hidden="true">
    <img class="logo-celular-icone logo-escuro" src="assets/icon-white1.png?v=5" alt="" aria-hidden="true">
    <img class="logo-celular-nome logo-claro" src="assets/Love-dark-03.png" alt="Love">
    <img class="logo-celular-nome logo-escuro" src="assets/Love-white-03.png" alt="Love">
  </a>
  <div class="topbar-account-wrap">
    <a href="dashboard" class="topbar-account-name" id="topbar-account-name" title="Ir para o início">—</a>
  </div>

  <button type="button" id="search-trigger" class="topbar-search-trigger">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
    <span>Pesquisar cliente, evento ou contrato…</span>
    <kbd>⌘K</kbd>
  </button>

  <div class="flex items-center gap-4 flex-shrink-0 ml-auto" id="topbar-icon-group">
    <a href="planos" id="header-upgrade-btn" class="topbar-upgrade-btn">
      <span>Upgrade</span>
    </a>

    <a href="chat" class="topbar-icon-plain topbar-messages-mobile-hide" data-page="chat" aria-label="Mensagens" data-dica="Mensagens">
      <!-- Mesmo ícone de Mensagens do love.com.br (os dois balões da barra do anfitrião). -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg>
      <span class="topbar-icon-badge" id="nav-msg-badge-header" style="display:none;">0</span>
    </a>

    <a href="produtos" class="topbar-icon-plain topbar-services-mobile-link" data-page="produtos" aria-label="Produtos" title="Produtos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5 12 2.25 3 7.5m18 0-9 5.25M21 7.5v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" /></svg>
    </a>

    <div class="topbar-icon-btn-wrap">
      <!-- Abre a página de Notificações. O número de não lidas começa
           escondido e vazio: só aparece quando o número real chega
           (updateNotificationsBadge em js/shell.js). -->
      <a href="notificacoes" id="notif-trigger" class="topbar-icon-plain" data-page="notificacoes" aria-label="Notificações" data-dica="Notificações">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
        <span class="topbar-icon-badge hidden" id="notif-dot"></span>
      </a>
    </div>

    <div class="topbar-icon-btn-wrap">
      <button type="button" id="avatar-trigger" class="topbar-avatar-btn">
        <span id="topbar-user-avatar" class="b2b-avatar" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#18181B;font-weight:600;font-size:.8125rem;"></span>
      </button>
      <div class="topbar-dropdown profile-dropdown" id="avatar-dropdown" style="right:0;left:auto;">
        <div class="profile-dropdown-header">
          <a href="configuracoes" id="profile-dropdown-avatar" class="profile-dropdown-avatar" title="Editar meu perfil"></a>
          <div class="min-w-0">
            <a href="configuracoes" class="profile-dropdown-name" id="profile-dropdown-name" title="Editar meu perfil">—</a>
            <p class="profile-dropdown-email" id="profile-dropdown-email">—</p>
          </div>
        </div>

        <div class="topbar-dropdown-divider"></div>

        <div id="profile-empresas" hidden></div>

        <!-- Itens no mesmo formato do menu "Minha conta" do love.com.br:
             ícone de 20px à esquerda, texto 14,5px. -->
        <a href="nova-empresa" class="topbar-dropdown-item topbar-item-adicionar-empresa">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          <span>Adicionar empresa</span>
        </a>

        <div class="topbar-dropdown-divider"></div>

        <a href="configuracoes" class="topbar-dropdown-item">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.6 6.6 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
          <span>Configurações</span>

        <a href="funcoes" class="topbar-dropdown-item">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/></svg>
          <span>Adicionar colaborador</span>
        </a>
        <a href="planos" class="topbar-dropdown-item">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z"/></svg>
          <span>Planos e recursos</span>
        </a>
        <a href="central-de-ajuda" class="topbar-dropdown-item">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25"></circle><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75a2.25 2.25 0 1 1 3.5 1.875c-.75.5-1.25 1.125-1.25 2.125m0 3h.01"/></svg>
          <span>Central de ajuda</span>
        </a>

        <div class="topbar-dropdown-divider"></div>

        <!-- Sair: mesmo item e mesmo ícone do menu do love.com.br. -->
        <a href="login" data-logout class="topbar-dropdown-item topbar-item-sair">
          <svg class="menu-perfil-icone" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
          <span>Sair</span>
        </a>
      </div>
    </div>
  </div>

  <button type="button" id="btn-menu-celular" class="menu-celular-botao" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-celular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>

<!-- Command palette -->
<div class="modal-backdrop" id="command-palette" style="align-items:flex-start;padding-top:12vh;">
  <div class="modal-card" style="max-width:560px;padding:0;overflow:visible;">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-zinc-200">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400 flex-shrink-0"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
      <input id="command-input" type="text" class="flex-1 border-none outline-none text-sm" placeholder="Pesquisar cliente, evento ou contrato…" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div id="command-results" class="max-h-80 overflow-y-auto p-2"></div>
  </div>
</div>
