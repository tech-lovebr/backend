<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos & Serviços — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#537bae">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans" data-page="produtos">

  <div class="b2b-shell">
    <div id="shell-sidebar"></div>

    <div class="b2b-main">
      <div id="shell-topbar"></div>

      <main class="b2b-content">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-base font-bold text-zinc-900 mb-1">Catálogo de produtos e serviços</h2>
            <p class="text-sm text-zinc-500">Gerencie o que aparece na sua vitrine dentro dos eventos.</p>
          </div>
          <button type="button" id="product-add-btn" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
            Adicionar produto/serviço
          </button>
        </div>

        <div class="category-tabs-bar" id="category-tabs"></div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </main>
    </div>
  </div>

  <!-- Modal produto -->
  <div class="modal-backdrop" id="product-modal">
    <div class="modal-card">
      <div class="flex items-center justify-between mb-5">
        <h3 id="product-modal-title" class="text-base font-bold text-zinc-900">Adicionar produto ou serviço</h3>
        <button type="button" id="product-modal-close" class="text-zinc-400 hover:text-zinc-700" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
      </div>

      <form id="product-form" class="flex flex-col gap-4">
        <div>
          <label for="product-name" class="field-label">Nome do produto/serviço</label>
          <input id="product-name" type="text" class="field-input" placeholder="Ex: Decoração Jardim Encantado">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="product-category" class="field-label">Categoria</label>
            <select id="product-category" class="field-select">
              <option value="">Selecione</option>
              <option>Assessoria</option>
              <option>Cerimonial</option>
              <option>Decoração</option>
              <option>Buffet</option>
              <option>Fotografia</option>
              <option>Música & DJ</option>
              <option>Convites & Papelaria</option>
              <option>Locação de Espaço</option>
              <option>Locação de Equipamentos</option>
            </select>
          </div>
          <div>
            <label for="product-price" class="field-label">Preço (R$)</label>
            <input id="product-price" type="number" min="0" step="50" class="field-input" placeholder="0,00">
          </div>
        </div>

        <div>
          <label for="product-description" class="field-label">Descrição</label>
          <textarea id="product-description" class="field-textarea" style="min-height:100px;" placeholder="Detalhe o que está incluso neste produto ou serviço…"></textarea>
        </div>

        <label class="flex items-center gap-2 text-sm text-zinc-600 select-none">
          <input id="product-active" type="checkbox" checked class="rounded border-zinc-300 text-[color:var(--primary-blue)] focus:ring-[color:var(--primary-blue)]">
          Exibir na vitrine dos eventos
        </label>

        <div class="flex items-center gap-3 pt-2">
          <button type="submit" class="btn-primary">Salvar item</button>
          <button type="button" id="product-modal-cancel" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
