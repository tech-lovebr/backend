<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTSEBKVH96"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GTSEBKVH96');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183b54">
  <link rel="icon" type="image/png" href="assets/love-logo-google-120.png?v=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=581">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=2"></script>
</head>
<body class="font-sans">

  <div class="signup-shell">
    <div class="signup-card">
      <a href="login" class="signup-logo">
        <img src="assets/logo.png" alt="Love">
      </a>

      <h1 class="signup-title">Crie uma nova senha</h1>
      <p class="signup-subtitle">Escolha uma senha nova para acessar sua conta.</p>

      <form id="reset-form" class="signup-email-form">
        <input type="password" id="reset-password" class="field-input" placeholder="Nova senha" required autocomplete="new-password" minlength="6">
        <input type="password" id="reset-password-confirm" class="field-input" placeholder="Confirme a nova senha" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn-primary justify-center w-full py-3" id="reset-btn">Salvar nova senha</button>
        <p id="reset-error" class="text-xs text-red-600 hidden"></p>
      </form>

      <p id="reset-invalid" class="text-sm text-zinc-500 mt-2 hidden">Esse link de redefinição é inválido ou já expirou. <a href="login" class="font-semibold text-[color:var(--primary-blue)] hover:underline">Solicite um novo</a> na tela de login.</p>
    </div>
  </div>

  <script>
    (async function () {
      // O link do e-mail traz o token no hash da URL; o cliente Supabase o
      // detecta sozinho (detectSessionInUrl, ligado por padrão) e abre uma
      // sessão de recuperação — só então dá pra trocar a senha.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('reset-invalid').classList.remove('hidden');
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-password-confirm').value;
      const errorEl = document.getElementById('reset-error');
      const btn = document.getElementById('reset-btn');

      errorEl.classList.add('hidden');

      if (password !== confirm) {
        errorEl.textContent = 'As senhas não coincidem.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password });
      btn.disabled = false;

      if (error) {
        errorEl.textContent = 'Não foi possível salvar a nova senha. Tente novamente.';
        errorEl.classList.remove('hidden');
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
