<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crie sua conta — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183b54">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=392">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js"></script>
</head>
<body class="font-sans">

  <div class="signup-shell">
    <div class="signup-card">
      <a href="index.html" class="signup-logo">
        <img src="../assets/logo.png" alt="Love">
      </a>

      <h1 class="signup-title">Crie sua conta</h1>
      <p class="signup-subtitle">100% gratuito. Sem necessidade de cartão de crédito.</p>

      <form id="signup-email-form" class="signup-email-form">
        <input type="text" id="signup-company" class="field-input" placeholder="Nome da sua empresa" required autocomplete="organization">
        <input type="email" id="signup-email" class="field-input" placeholder="nome@empresa.com" required autocomplete="email">
        <input type="password" id="signup-password" class="field-input" placeholder="Crie uma senha" required autocomplete="new-password" minlength="6">
        <button type="submit" class="btn-primary justify-center w-full py-3" id="signup-email-btn">Criar conta</button>
        <p id="signup-error" class="text-xs text-red-600 hidden"></p>
      </form>

      <p class="signup-legal">Ao continuar, você reconhece a <a href="#">Política de privacidade</a> da Love e concorda em receber atualizações ocasionais de produtos e e-mails promocionais.</p>

      <p class="signup-footer-link">Tem uma conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script>
    document.getElementById('signup-email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const company = document.getElementById('signup-company').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const errorEl = document.getElementById('signup-error');
      const submitBtn = document.getElementById('signup-email-btn');

      errorEl.classList.add('hidden');
      submitBtn.disabled = true;

      const { error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { role: 'fornecedor', company_name: company } }
      });

      submitBtn.disabled = false;

      if (error) {
        errorEl.textContent = error.message.includes('already registered')
          ? 'Esse e-mail já tem uma conta. Tente entrar.'
          : 'Não foi possível criar sua conta. Verifique os dados e tente novamente.';
        errorEl.classList.remove('hidden');
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
