<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crie sua conta — Portal do Fornecedor Love</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#183b54">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] } } }
    }
  </script>

  <link rel="stylesheet" href="css/styles.css?v=392">
</head>
<body class="font-sans">

  <div class="signup-shell">
    <div class="signup-card">
      <a href="index.html" class="signup-logo">
        <img src="../assets/logo.png" alt="Love">
      </a>

      <h1 class="signup-title">Crie sua conta</h1>
      <p class="signup-subtitle">100% gratuito. Sem necessidade de cartão de crédito.</p>

      <div class="signup-oauth">
        <button type="button" class="signup-oauth-btn" data-provider="Google">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a9.96 9.96 0 0 1 6.29 2.226a1 1 0 0 1 .04 1.52l-1.51 1.362a1 1 0 0 1 -1.265 .06a6 6 0 1 0 2.103 6.836l.001 -.004h-3.66a1 1 0 0 1 -.992 -.883l-.007 -.117v-2a1 1 0 0 1 1 -1h6.945a1 1 0 0 1 .994 .89c.04 .367 .061 .737 .061 1.11c0 5.523 -4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10z" /></svg>
          Continuar com Google
        </button>
        <button type="button" class="signup-oauth-btn" data-provider="Microsoft">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 13v5c0 1.57 -1.248 2.832 -2.715 2.923l-.113 .003l-.042 .018a1 1 0 0 1 -.336 .056l-.118 -.008l-4.676 -.585v-7.407zm-10 0v7.157l-5.3 -.662c-1.514 -.151 -2.7 -1.383 -2.7 -2.895v-3.6zm0 -9.158v7.158h-8v-3.6c0 -1.454 1.096 -2.648 2.505 -2.87zm10 2.058v5.1h-8v-7.409l4.717 -.589c1.759 -.145 3.283 1.189 3.283 2.898" /></svg>
          Continuar com Microsoft
        </button>
        <button type="button" class="signup-oauth-btn" data-provider="Apple">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.079 5.999l.239 .012c1.43 .097 3.434 1.013 4.508 2.586a1 1 0 0 1 -.344 1.44c-.05 .028 -.372 .158 -.497 .217a4.15 4.15 0 0 0 -.722 .431c-.614 .461 -.948 1.009 -.942 1.694c.01 .885 .339 1.454 .907 1.846c.208 .143 .436 .253 .666 .33c.126 .043 .426 .116 .444 .122a1 1 0 0 1 .662 .942c0 2.621 -3.04 6.381 -5.286 6.381c-.79 0 -1.272 -.091 -1.983 -.315l-.098 -.031c-.463 -.146 -.702 -.192 -1.133 -.192c-.52 0 -.863 .06 -1.518 .237l-.197 .053c-.575 .153 -.964 .226 -1.5 .248c-2.749 0 -5.285 -5.093 -5.285 -9.072c0 -3.87 1.786 -6.92 5.286 -6.92c.297 0 .598 .045 .909 .128c.403 .107 .774 .26 1.296 .508c.787 .374 .948 .44 1.009 .44h.016c.03 -.003 .128 -.047 1.056 -.457c1.061 -.467 1.864 -.685 2.746 -.616l-.24 -.012z" /><path d="M14 1a1 1 0 0 1 1 1a3 3 0 0 1 -3 3a1 1 0 0 1 -1 -1a3 3 0 0 1 3 -3z" /></svg>
          Continuar com a Apple
        </button>
      </div>

      <div class="signup-divider"><span>ou</span></div>

      <form id="signup-email-form" class="signup-email-form">
        <input type="email" id="signup-email" class="field-input" placeholder="nome@empresa.com" required autocomplete="email">
        <button type="submit" class="btn-primary justify-center w-full py-3" id="signup-email-btn" disabled>Continuar com e-mail</button>
      </form>

      <p class="signup-legal">Ao continuar, você reconhece a <a href="#">Política de privacidade</a> da Love e concorda em receber atualizações ocasionais de produtos e e-mails promocionais.</p>

      <p class="signup-footer-link">Tem uma conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script>
    // Cadastro mock — sem backend real. Provedores sociais pulam direto
    // para o painel; e-mail segue para a verificação por código.
    document.querySelectorAll('.signup-oauth-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        localStorage.setItem('b2b-onboarding-pending', '1');
        window.location.href = 'dashboard.html';
      });
    });

    const emailInput = document.getElementById('signup-email');
    const emailBtn = document.getElementById('signup-email-btn');
    emailInput.addEventListener('input', () => {
      emailBtn.disabled = emailInput.value.trim().length === 0;
    });

    document.getElementById('signup-email-form').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('b2b-signup-email', emailInput.value.trim());
      window.location.href = 'verificar.html';
    });
  </script>
</body>
</html>
