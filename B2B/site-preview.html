<body class="font-sans" data-page="site-preview">

  <div id="checkout-payment-banner-root"></div>
  <div class="builder-canvas" id="builder-canvas" data-device="desktop"></div>
  <div class="builder-mobile-menu-root" id="builder-mobile-menu-root"></div>

  <script src="js/data.js?v=18"></script>
  <script src="js/utils.js?v=32"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-init.js?v=3"></script>
  <script src="js/shell.js?v=60"></script>
  <script src="js/site-builder.js?v=292"></script>
  <script>
    (async function () {
      const canvas = document.getElementById('builder-canvas');
      const params = new URLSearchParams(location.search);
      const isCheckout = params.get('page') === 'checkout';
      const linkId = params.get('link');
      // De onde vem o slug do site publicado (as duas reescritas acontecem no
      // servidor, então a URL do navegador não traz ?site=):
      // - plano Pro: <slug>.love.com.br (middleware.js) → slug é o subdomínio;
      // - plano gratuito: hub.love.com.br/<slug> (último rewrite do
      //   vercel.json) → slug é o caminho.
      // O ?site= fica como alternativa manual.
      const SITE_DOMAIN_SUFFIX = '.love.com.br';
      const hostSlug = location.hostname.endsWith(SITE_DOMAIN_SUFFIX)
        ? location.hostname.slice(0, -SITE_DOMAIN_SUFFIX.length)
        : '';
      // Gratuito: hub.love.com.br/site/<slug> (o antigo hub.love.com.br/<slug> continua abrindo).
      const pathSlug = location.pathname.replace(/^\/+|\/+$/g, '').replace(/^site\//, '');
      const viaSubdomain = !!hostSlug && hostSlug !== 'hub' && hostSlug !== 'www' && !hostSlug.includes('.');
      const viaHubPath = !viaSubdomain && /^[a-z0-9-]+$/.test(pathSlug) && pathSlug !== 'site-preview';
      const publicSlug = viaSubdomain ? hostSlug : viaHubPath ? pathSlug : params.get('site');
      canvas.dataset.pageKey = isCheckout ? 'checkout' : 'home';

      let paymentLink = null;
      if (isCheckout && linkId) {
        renderCheckoutPaymentBanner(linkId);
        const { data } = await supabaseClient.from('payment_links').select('*').eq('id', linkId).maybeSingle();
        paymentLink = data;
      }

      // O checkout precisa ser visível pra qualquer cliente que abra um link
      // de pagamento (sem login, de outro navegador) — por isso busca o
      // template publicado no Supabase antes de cair pro localStorage local.
      let loadedState = null;
      if (isCheckout) {
        let fornecedorId = paymentLink ? paymentLink.fornecedor_id : null;
        if (!fornecedorId) {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) fornecedorId = session.user.id;
        }
        if (fornecedorId) {
          const { data: page } = await supabaseClient.from('checkout_pages').select('state').eq('fornecedor_id', fornecedorId).maybeSingle();
          if (page && page.state) loadedState = page.state;
        }
      }

      // Visitante entrando por <slug>.love.com.br: busca o site publicado
      // pelo slug. Se não achar, para aqui — nunca cai pro localStorage,
      // senão um visitante que compartilhe o navegador com quem edita
      // acabaria vendo o rascunho local de outra pessoa.
      if (!loadedState && publicSlug) {
        // site_publicado (migration 038) devolve o site e se o dono é Pro —
        // o anon não pode ler o plano direto em `fornecedores`. Se a function
        // ainda não existir no banco, cai pra leitura simples sem checar plano.
        let page = null;
        let donoPro = null;
        const rpc = await supabaseClient.rpc('site_publicado', { p_slug: publicSlug }).maybeSingle();
        if (!rpc.error) {
          page = rpc.data;
          donoPro = !!(page && page.dono_pro);
        } else {
          const { data } = await supabaseClient.from('site_pages').select('state').eq('slug', publicSlug).maybeSingle();
          page = data;
        }

        if (!page || !page.state) {
          canvas.innerHTML = '<div class="site-preview-empty">Esse site ainda não foi publicado.</div>';
          window.b2bPageReady?.();
          return;
        }

        // Subdomínio é só do Pro; o Gratuito fica em hub.love.com.br/<slug>.
        // Cada um que chegar pelo endereço do outro plano é levado pro certo.
        if (viaSubdomain && donoPro === false) {
          location.replace(`https://hub.love.com.br/site/${publicSlug}`);
          return;
        }
        if (viaHubPath && donoPro === true) {
          location.replace(`https://${publicSlug}${SITE_DOMAIN_SUFFIX}/`);
          return;
        }
        // Endereço antigo do Gratuito (hub.love.com.br/<slug>): vai para /site/<slug>.
        if (viaHubPath && donoPro === false && !location.pathname.startsWith('/site/')) {
          location.replace(`https://hub.love.com.br/site/${publicSlug}`);
          return;
        }

        loadedState = page.state;

        // Sessões no site (Analytics do dashboard): uma visita por sessão do
        // navegador. O id vive no sessionStorage (some ao fechar a aba). Ver
        // registrar_visita_site na migration 053.
        try {
          const chaveSessao = 'love-site-sessao-' + publicSlug;
          let sessao = sessionStorage.getItem(chaveSessao);
          if (!sessao) {
            sessao = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
            sessionStorage.setItem(chaveSessao, sessao);
          }
          supabaseClient.rpc('registrar_visita_site', {
            p_slug: publicSlug, p_sessao: sessao, p_referrer: document.referrer || null
          }).then(() => {}, () => {});
        } catch (e) { /* sem sessionStorage: não conta */ }
      }

      if (!loadedState && !publicSlug) {
        const raw = localStorage.getItem(isCheckout ? CHECKOUT_PUBLISHED_STATE_KEY : BUILDER_PUBLISHED_STATE_KEY);
        if (raw) {
          try { loadedState = JSON.parse(raw); } catch (e) { loadedState = null; }
        }
      }

      if (!loadedState) {
        canvas.innerHTML = '<div class="site-preview-empty">Esta página ainda não foi publicada. Volte para "Editor de Site" e clique em "Publicar".</div>';
        window.b2bPageReady?.();
        return;
      }

      try {
        builderState = loadedState;
        if (isCheckout && builderState.templateVersion !== CHECKOUT_TEMPLATE_VERSION) builderState = defaultCheckoutPageState();
        migrateElementDefaults(builderState);
      } catch (e) {
        canvas.innerHTML = '<div class="site-preview-empty">Não foi possível carregar sua página.</div>';
        window.b2bPageReady?.();
        return;
      }

      const seo = builderState.siteSettings && builderState.siteSettings.seo;
      if (seo && seo.metaTitle) document.title = seo.metaTitle;
      if (seo && seo.metaDescription) {
        const metaDesc = document.createElement('meta');
        metaDesc.name = 'description';
        metaDesc.content = seo.metaDescription;
        document.head.appendChild(metaDesc);
      }
      if (seo && seo.favicon) {
        const favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.href = seo.favicon;
        document.head.appendChild(favicon);
      }

      // Injeta o valor real do link de pagamento no template do checkout: o
      // fornecedor desenha o layout, mas o TOTAL exibido é o do link aberto.
      let submitElementId = null;
      if (isCheckout && paymentLink) {
        Object.values(allElementsById()).forEach(el => {
          if (el.checkoutRole === 'total') el.content = `TOTAL: ${formatCurrency(paymentLink.amount)}`;
          if (el.checkoutRole === 'submit') submitElementId = el.id;
        });
      }

      applyGlobalStyleVars();
      const visible = builderState.sections.filter(s => !s.hidden);
      const menuRoot = document.getElementById('builder-mobile-menu-root');

      const currentDeviceBucket = () => (window.innerWidth || document.documentElement.clientWidth) < 768 ? 'mobile' : 'desktop';
      let renderedDevice = null;

      function renderForDevice(device) {
        renderedDevice = device;
        canvas.dataset.device = device;
        canvas.innerHTML = renderFixedHeaderHtml()
          + (visible.length ? visible.map(s => renderSectionHtml(s, 'preview', device)).join('') : '<div class="site-preview-empty">Sua página ainda não tem seções visíveis.</div>')
          + renderFixedFooterHtml();

        if (device === 'mobile') {
          menuRoot.innerHTML = renderMobileMenuDrawerHtml();
          wireMobileMenuDrawer(menuRoot);
        } else {
          menuRoot.innerHTML = '';
        }
        wireFixedHeader(canvas);
        wireCheckoutAddressLookup(canvas);
        applyFloatingHeaderOverlap(canvas);

        if (submitElementId && paymentLink) {
          const submitBlock = canvas.querySelector(`[data-element-id="${submitElementId}"]`);
          const submitBtn = submitBlock && submitBlock.querySelector('a, button');
          if (submitBtn) {
            submitBtn.addEventListener('click', (e) => {
              e.preventDefault();
              payPaymentLink(paymentLink, submitBtn);
            });
          }
        }
      }

      renderForDevice(currentDeviceBucket());
      window.b2bPageReady?.();

      let resizeTimer = null;
      const handleViewportChange = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const next = currentDeviceBucket();
          if (next !== renderedDevice) renderForDevice(next);
          else applyFloatingHeaderOverlap(canvas);
        }, 150);
      };
      window.addEventListener('resize', handleViewportChange);
      window.addEventListener('orientationchange', handleViewportChange);
      if (window.matchMedia) {
        const mq = window.matchMedia('(max-width: 767px)');
        const mqListener = () => handleViewportChange();
        if (mq.addEventListener) mq.addEventListener('change', mqListener);
        else if (mq.addListener) mq.addListener(mqListener);
      }
    })();

    async function payPaymentLink(link, triggerBtn) {
      if (link.status === 'pago') return;
      if (triggerBtn) triggerBtn.style.pointerEvents = 'none';

      const paidAt = new Date().toISOString();
      const { error } = await supabaseClient
        .from('payment_links')
        .update({ status: 'pago', paid_at: paidAt })
        .eq('id', link.id);
      if (error) { if (triggerBtn) triggerBtn.style.pointerEvents = ''; return; }

      link.status = 'pago';
      link.paid_at = paidAt;

      // Se esse link veio de um orçamento (Vendas), o pagamento fecha o
      // ciclo: o orçamento vira "pago" e o contato no CRM vira "Fechado".
      // Isso mexe em dados do fornecedor (leads), então roda no servidor
      // (service role) em vez de direto do navegador de quem está pagando.
      if (link.orcamento_id) {
        fetch('/api/confirmar-orcamento', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentLinkId: link.id })
        }).catch(() => {});
      }

      await supabaseClient.from('notas_fiscais').insert({
        fornecedor_id: link.fornecedor_id,
        source_payment_link_id: link.id,
        client: 'Consumidor',
        value: link.amount,
        number: 'NF-' + Date.now().toString(36).toUpperCase()
      });
      await supabaseClient.from('wallet_transactions').insert({
        fornecedor_id: link.fornecedor_id,
        type: 'credit',
        amount: link.amount,
        description: 'Pagamento recebido via link',
        payment_link_id: link.id
      });

      renderCheckoutPaymentBanner(link.id);
    }

    function renderCheckoutPaymentBanner(linkId) {
      const root = document.getElementById('checkout-payment-banner-root');
      if (!root) return;

      const loadLink = async () => {
        const { data } = await supabaseClient.from('payment_links').select('*').eq('id', linkId).maybeSingle();
        return data;
      };

      const draw = async () => {
        const link = await loadLink();
        if (!link) { root.innerHTML = ''; return; }

        const isPaid = link.status === 'pago';
        const installmentsLabel = link.installments > 1
          ? `${link.installments}x de ${formatCurrency(link.amount / link.installments)}`
          : 'à vista';

        root.innerHTML = `
          <div class="checkout-payment-banner${isPaid ? ' is-paid' : ''}" style="margin:1.5rem auto 0;">
            <div>
              <p class="checkout-payment-banner-amount">${formatCurrency(link.amount)}</p>
              <p class="checkout-payment-banner-installments">${isPaid ? 'Pagamento confirmado' : installmentsLabel}</p>
            </div>
            ${isPaid
              ? '<span class="status-badge status-ativo">Pago</span>'
              : '<button type="button" class="btn-primary" id="checkout-pay-now-btn">Pagar agora</button>'}
          </div>
        `;

        const payBtn = document.getElementById('checkout-pay-now-btn');
        if (payBtn) {
          payBtn.addEventListener('click', async () => {
            payBtn.disabled = true;
            await payPaymentLink(link, null);
          });
        }
      };

      draw();
    }
  </script>
