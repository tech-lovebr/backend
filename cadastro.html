<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — Love</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .onboard-dot { height: 4px; border-radius: 2px; background: #E4E4E7; flex: 1; }
    .onboard-dot.is-done { background: #18181B; }
    .onboard-step { display: none; }
    .onboard-step.is-active { display: block; }
    .type-card.is-selected { border-color: #537bae; background: #EBF4FF; }
  </style>
</head>
<body class="bg-white">

  <div class="min-h-screen w-full flex flex-col lg:flex-row">

    <!-- Coluna esquerda: formulário em etapas -->
    <div class="w-full lg:w-1/2 flex flex-col px-6 sm:px-14 py-10">
      <a href="index.html">
        <img src="assets/logo.png?v=2" alt="Love" class="h-8 w-auto object-contain">
      </a>

      <div class="flex items-center gap-1.5 mt-10 max-w-sm" id="onboard-dots">
        <div class="onboard-dot is-done"></div>
        <div class="onboard-dot"></div>
      </div>

      <div class="flex-1 flex flex-col justify-center max-w-sm w-full mx-auto lg:mx-0">

        <!-- Etapa 1: o que está celebrando -->
        <div class="onboard-step is-active" data-step="1">
          <h1 class="text-3xl sm:text-4xl font-extrabold text-zinc-900 leading-tight mb-8">
            O que você está celebrando?
          </h1>

          <div class="space-y-2.5" id="onboard-type-list">
            <button type="button" class="type-card w-full text-left px-5 py-4 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-sm font-semibold text-zinc-800 transition-all" data-type="wedding" data-label="Casamento">Casamento</button>
            <button type="button" class="type-card w-full text-left px-5 py-4 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-sm font-semibold text-zinc-800 transition-all" data-type="birthday" data-label="Aniversário">Aniversário</button>
            <button type="button" class="type-card w-full text-left px-5 py-4 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-sm font-semibold text-zinc-800 transition-all" data-type="anniversary" data-label="Bodas">Bodas</button>
            <button type="button" class="type-card w-full text-left px-5 py-4 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-sm font-semibold text-zinc-800 transition-all" data-type="baby_shower" data-label="Chá de Bebê">Chá de Bebê</button>
            <button type="button" class="type-card w-full text-left px-5 py-4 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-sm font-semibold text-zinc-800 transition-all" data-type="birthday" data-label="Festa de 15 Anos">Festa de 15 Anos</button>
          </div>

          <div class="flex justify-end mt-10">
            <button type="button" id="btn-onboard-next" disabled class="px-8 py-3 rounded-xl bg-zinc-900 text-white text-sm font-bold disabled:opacity-30 disabled:cursor-not-allowed transition-opacity">
              Próximo
            </button>
          </div>
        </div>

        <!-- Etapa 2: dados da conta -->
        <div class="onboard-step" data-step="2">
          <button type="button" id="btn-onboard-back" class="text-xs font-bold text-zinc-500 hover:text-zinc-800 mb-6 transition-colors">← Voltar</button>

          <h1 class="text-3xl sm:text-4xl font-extrabold text-zinc-900 leading-tight mb-8">
            Crie sua conta grátis
          </h1>

          <form id="form-onboard-register" class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold text-zinc-700 mb-1">Nome</label>
              <input type="text" id="onboard-name-input" required placeholder="Qual é o seu nome?" class="w-full text-sm p-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:ring-2 focus:ring-[#537bae] focus:outline-none text-zinc-800">
            </div>
            <div>
              <label class="block text-xs font-bold text-zinc-700 mb-1">E-mail</label>
              <input type="email" id="onboard-email-input" required placeholder="seu.email@exemplo.com" class="w-full text-sm p-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:ring-2 focus:ring-[#537bae] focus:outline-none text-zinc-800">
            </div>
            <div>
              <label class="block text-xs font-bold text-zinc-700 mb-1">Senha</label>
              <input type="password" id="onboard-password-input" required minlength="6" placeholder="Crie uma senha" class="w-full text-sm p-3 rounded-xl border border-zinc-200 bg-zinc-50 focus:bg-white focus:ring-2 focus:ring-[#537bae] focus:outline-none text-zinc-800">
            </div>
            <button type="submit" id="btn-onboard-submit" class="w-full py-3.5 rounded-xl bg-[#537bae] hover:bg-[#416799] text-white text-sm font-bold shadow-md transition-all mt-2">
              Criar conta
            </button>
          </form>

          <p class="text-xs text-zinc-500 text-center mt-5">
            Já tem uma conta? <a href="index.html" class="text-[#537bae] font-bold hover:underline">Entrar</a>
          </p>
        </div>

      </div>
    </div>

    <!-- Coluna direita: painel decorativo -->
    <div class="hidden lg:flex w-1/2 bg-[#181D24] items-center justify-center p-12 relative overflow-hidden">
      <div class="relative z-10 max-w-md text-center">
        <img src="assets/wedding_hero_banner.jpg" alt="" class="rounded-2xl shadow-2xl w-full h-80 object-cover mb-8">
        <p class="text-white text-lg font-medium leading-relaxed">
          "Do convite ao resgate em dinheiro via PIX — tudo em um único lugar."
        </p>
        <p class="text-white/50 text-sm mt-3">Comece sua celebração em minutos</p>
      </div>
    </div>

  </div>

  <script>
    let onboardType = null;
    let onboardTypeLabel = null;

    const typeList = document.getElementById('onboard-type-list');
    const btnNext = document.getElementById('btn-onboard-next');
    const dots = document.querySelectorAll('.onboard-dot');

    typeList.querySelectorAll('.type-card').forEach(card => {
      card.addEventListener('click', () => {
        typeList.querySelectorAll('.type-card').forEach(c => c.classList.remove('is-selected'));
        card.classList.add('is-selected');
        onboardType = card.dataset.type;
        onboardTypeLabel = card.dataset.label;
        btnNext.disabled = false;
      });
    });

    function goToStep(step) {
      document.querySelectorAll('.onboard-step').forEach(s => {
        s.classList.toggle('is-active', s.dataset.step === String(step));
      });
      dots.forEach((d, i) => d.classList.toggle('is-done', i < step));
    }

    btnNext.addEventListener('click', () => goToStep(2));
    document.getElementById('btn-onboard-back').addEventListener('click', () => goToStep(1));

    document.getElementById('form-onboard-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('onboard-name-input').value.trim();
      const email = document.getElementById('onboard-email-input').value.trim();
      const password = document.getElementById('onboard-password-input').value;
      const submitBtn = document.getElementById('btn-onboard-submit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Criando...';

      const { error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { role: 'cliente', couple_name: name } }
      });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Criar conta';
        alert(error.message === 'User already registered' ? 'Esse e-mail já tem uma conta. Faça login.' : 'Não foi possível criar sua conta: ' + error.message);
        return;
      }

      if (onboardType) {
        localStorage.setItem('love-pending-event-type', onboardType);
        localStorage.setItem('love-pending-event-type-label', onboardTypeLabel || '');
      }
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
