  <style>
    html, body { background: #F1F1EF; overflow-x: hidden; margin: 0; min-height: 100vh; }
    #public-preview-root {
      max-width: 480px;
      margin: 0 auto;
      background: #FBFBFA;
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.06);
    }

    /* O convite ocupa sempre a altura toda da janela, com o rodapé colado
       embaixo: o espaço que sobra vira respiro (em cima e embaixo) nas seções
       abaixo da capa. Conteúdo maior que a tela rola normalmente. */
    #public-preview-root {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    #public-preview-root > section:not(.convite-capa),
    #public-preview-root > .convite-tela {
      flex: 1 0 auto;
      /* !important: o CSS do editor força display:block nas seções. */
      display: flex !important;
      flex-direction: column;
      justify-content: center;
    }
    #public-preview-root > .convite-tela { justify-content: flex-start; }
    /* Em flex, conteúdo com margin:auto encolhe — mantém a largura original. */
    #public-preview-root > section:not(.convite-capa) > * { width: 100%; box-sizing: border-box; }
    #public-preview-root > .builder-fixed-footer { flex-shrink: 0; margin-top: auto; }
    .public-preview-empty {
      padding: 6rem 1.5rem;
      text-align: center;
      color: #71717A;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      line-height: 1.6;
    }

    /* Telas internas do convite: Informações, Lista de Presentes, Confirmar presença */
    .convite-tela { padding: 1.5rem 1.5rem 3rem; font-family: 'Inter', sans-serif; color: #18181B; }
    .convite-voltar { background: none; border: 0; padding: 0; color: #71717A; font-size: 0.8125rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .convite-voltar:hover { color: #18181B; }
    .convite-tela-titulo { font-size: 1.5rem; font-weight: 700; margin: 1.25rem 0 1.5rem; letter-spacing: -0.01em; }
    /* Foto cheia, de ponta a ponta (sem as margens da tela), com a mesma
       altura da capa da página principal do convite. */
    .convite-tela-capa { margin: -0.25rem -1.5rem 1.5rem; height: 348px; overflow: hidden; background: #F4F4F5; }
    .convite-tela-capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .convite-vazio { color: #71717A; font-size: 0.9375rem; line-height: 1.6; }
    .convite-info { padding: 1rem 0; border-top: 1px solid #EAEAEA; }
    .convite-info:first-of-type { border-top: 0; padding-top: 0; }
    .convite-info-rotulo { font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #71717A; margin: 0 0 0.35rem; }
    .convite-info-valor { font-size: 0.9375rem; line-height: 1.55; margin: 0; }
    .convite-link { display: inline-block; margin-top: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--bx-primary, #537bae); }
    .convite-presentes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.875rem; }
    .convite-presente { background: #FFFFFF; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04); }
    .convite-presente.is-recebido { opacity: 0.55; }
    .convite-presente-foto { aspect-ratio: 1 / 1; background: linear-gradient(135deg, #EFF6FF, #FAFAFA, #FFF7ED); }
    .convite-presente-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .convite-presente-texto { padding: 0.65rem 0.75rem 0.8rem; }
    .convite-presente-nome { font-size: 0.8125rem; font-weight: 600; margin: 0 0 0.2rem; line-height: 1.35; }
    .convite-presente-valor { font-size: 0.8125rem; color: #71717A; margin: 0; }
    .convite-form { display: flex; flex-direction: column; gap: 1rem; }
    .convite-form label { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.8125rem; font-weight: 600; }
    .convite-form label span { font-weight: 400; color: #A1A1AA; }
    .convite-form input { font: inherit; font-weight: 400; font-size: 0.9375rem; padding: 0.8rem 0.9rem; border-radius: 12px; border: 1px solid #E4E4E7; background: #FFFFFF; color: #18181B; }
    .convite-form input:focus { outline: none; border-color: var(--bx-primary, #537bae); box-shadow: 0 0 0 3px rgba(83,123,174,0.15); }
    .convite-erro { color: #DC2626; font-size: 0.8125rem; margin: 0; }
    .convite-botao { margin-top: 0.5rem; padding: 0.9rem 1rem; border: 0; border-radius: 12px; background: var(--bx-primary, #537bae); color: #FFFFFF; font: inherit; font-weight: 700; font-size: 0.9375rem; cursor: pointer; }
    .convite-botao:disabled { opacity: 0.7; cursor: default; }
    .convite-sucesso { text-align: center; padding: 2rem 0; font-size: 0.9375rem; line-height: 1.6; color: #3F3F46; }
    .convite-sucesso-titulo { font-size: 1.25rem; font-weight: 700; color: #18181B; margin: 0 0 0.5rem; }
    .convite-sobre-nomes { margin-bottom: 1.25rem; font-weight: 600; }
    .convite-sobre-texto { font-size: 0.9375rem; line-height: 1.7; color: #3F3F46; margin: 0; }
  </style>
