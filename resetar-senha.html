<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Redefinir senha — Love</title>
  <!-- O "Crie uma nova senha" agora abre dentro da caixa do login
       (/login?nova-senha=1). Esta página só repassa os links já enviados,
       levando o token (?code / ?token_hash / #access_token / #error). -->
  <script>
    (function () {
      var resto = location.search ? '&' + location.search.slice(1) : '';
      location.replace('/login?nova-senha=1' + resto + location.hash);
    })();
  </script>
</head>
<body style="margin:0;background:#fff"></body>
</html>
